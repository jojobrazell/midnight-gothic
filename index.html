<script type="module">
/* MIDNIGHT MIRROR, the projection.
 *
 * THE MODEL (JoJo, 2026-08-13): the mirror shows a ROOM, not people. Every guest who
 * steps through LIGHTS A CANDLE in a baroque ballroom, and the room fills with light as
 * the floor fills with people.
 *
 * The camera is an ENHANCEMENT AND NEVER A DEPENDENCY. Flames have their own spring
 * physics and look alive with nothing plugged in; the sensor only adds a force. A
 * camera in a dark venue is the same risk class that killed the projected 3D room, so
 * this build has to survive it failing, being refused, or never being installed.
 *
 * getUserMedia needs a secure context, and the venue machine loads this from localhost,
 * which counts as one. No HTTPS, no tunnel, no internet.
 */
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { buildHall, DIMS } from './hall.js';
import { Flames, MotionField, makeFlameTextures } from './flames.js';
import { AudioField } from './audio.js';
import { bakeIrradiance, setFlicker } from './bake.js';
import { place, hangTopAt, hangBottomAt, partBox } from './models.js';
import { mergeGeometries } from './vendor-three/addons/utils/BufferGeometryUtils.js';

const qs = new URLSearchParams(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEV = qs.get('dev') === '1';
const NOCAM = qs.get('nocam') === '1';
const NOMIC = qs.get('nomic') === '1';
/* Perf escape hatches for the venue machine: if the load-in fps readout says the GPU
   cannot hold 60 with the full stack, drop the expensive layers without touching code.
   Quality must never hold the night hostage. */
const NOAO = qs.get('noao') === '1';
const NOSHADOW = qs.get('noshadow') === '1';
/* LITE: the phone tier. This room was built for a laptop driving a projector, and the full
   post stack (GTAO, bloom, SMAA) on top of a 460k-vertex irradiance bake buries a phone GPU,
   which is the lag JoJo saw. LITE caps the pixel ratio (a retina phone otherwise renders
   about 4x the pixels), drops the ambient-occlusion pass, halves the shadow map, thins the
   particles, and SKIPS the bake. The bake's per-vertex solve is the single worst offender
   for mobile load jank, and the room reads fine on the real-time lights alone (most of the
   review captures ran nobake). Auto-on for a touch device or a small screen; ?full=1 forces
   the whole stack (used to render the client video), ?lite=1 forces the tier on desktop. */
const LITE = qs.has('full') ? false
           : qs.has('lite') ? true
           : (matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 820);

/* LOADING SCREEN dismiss, defined HERE (before the top-level await that loads the models)
   so window.__liftSplash exists when the models-ready line calls it. #ld is plain body HTML
   and this module is deferred, so the element is already present. Called directly on
   models-ready, never on a poll, with a hard fallback so a stalled or model-less load still
   clears it. */
window.__liftSplash = (() => {
  const ld = document.getElementById('ld');
  let done = false;
  const gone = () => { if (done || !ld) return; done = true;
    ld.style.opacity = '0'; ld.style.pointerEvents = 'none'; setTimeout(() => ld.remove(), 1000); };
  setTimeout(gone, 16000);
  return gone;
})();

/* ---------- PORTAL MODE (default ON) ----------
   JoJo, 2026-08-13: the projector fills the venue wall floor-to-ceiling, and the hall
   should read as PART OF THE ROOM: the projected floor continuing the real floor.
   That is an anamorphic portal, and it needs three things a cinematic camera breaks:
   the eye at HUMAN height, verticals kept VERTICAL (zero pitch: the lens shifts
   instead, via an off-axis frustum), and the bottom of the frame meeting the virtual
   floor exactly AT the wall plane, so the boards flow out of the real skirting.
   Tune to the venue with ?wallh= (projected wall height, m), ?eyeh= (viewer eye
   height, m), ?eyed= (typical viewing distance from the wall, m). ?portal=0 falls
   back to the cinematic framing. */
/* VENUE-ONLY: the portal only reads correctly when physically projected 1:1 on the
   wall it was tuned for; on a monitor it looks like a camera on the floor (JoJo,
   2026-08-13, correctly: "we're way too close to the ground"). Review and proof packs
   use the cinematic default; the venue machine launches with ?portal=1. */
const PORTAL = qs.get('portal') === '1';
const WALL_H = +(qs.get('wallh') || 4.0);
const EYE_H = +(qs.get('eyeh') || 2.1);
const EYE_D = +(qs.get('eyed') || 7.0);

const C = {
  gold: 0xC8A24A, goldHi: 0xE7C978, plum: 0x2A1030, oxblood: 0x5A0E1B,
  rose: 0xE9A9B8, stone: 0x1A1520, amber: 0xFFB661,
  // LILAC-SILVER, deliberately not cyan: blue-white moonlight against amber candles
  // is the teal-and-orange trap, the cheapest grade in realtime 3D (design panel,
  // 2026-08-13). The moon here lives at ~240deg hue, low saturation.
  moon: 0xB9B6DC,
};

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({
  antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true,
});
renderer.setPixelRatio(Math.min(LITE ? 1.25 : 2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
/* AgX, not ACES (research panel, 2026-08-13): ACES is documented to skew EXACTLY our
   palette — saturated amber drifts lemon, purple drifts cyan. AgX holds both. It sits
   mid-grey lower, so exposure re-baselines up. */
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.02;
/* SHADOWS. The single loudest "cartoony" tell was zero shadow maps: light walked
   through balconies and nothing sat ON anything. One directional key carries them. */
renderer.shadowMap.enabled = !NOSHADOW;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
/* FROZEN shadow maps (research panel): the architecture never moves, so the shadow
   pass renders at 2Hz instead of every frame, which is near-zero cost and still keeps
   the swaying chandeliers' shadows approximately alive. */
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;
document.body.appendChild(renderer.domElement);

/* MIDNIGHT PURPLE atmosphere (client note relayed by JoJo 2026-08-13: "they mentioned
   a midnight purple"). The night itself is violet: background, fog and shadows all
   carry it, so the amber candles sit inside purple air instead of brown murk. */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0A0716);
scene.fog = new THREE.FogExp2(0x1C1140, 0.019);   // the haze itself carries the purple

/* fov 40 is a ~35mm lens: default-wide fovs are the "game demo" look. Near/far kept
   TIGHT because a sloppy frustum destroys depth precision and GTAO bands visibly. */
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.3, 140);
camera.position.set(0, 6.2, 24);

/* the window plane: the virtual hall begins where the real wall stands */
const WINZ = DIMS.Z0 + 4;
function applyPortal() {
  const aspect = innerWidth / innerHeight;
  const winW = WALL_H * aspect;              // the projector fills the wall, so the
  const k = camera.near / EYE_D;             // window aspect IS the output aspect
  camera.projectionMatrix.makePerspective(
    -winW / 2 * k, winW / 2 * k,
    (WALL_H - EYE_H) * k, -EYE_H * k,
    camera.near, camera.far);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}
if (PORTAL) applyPortal();

/* ---------- environment ---------- */
function buildEnvironment() {
  const env = new THREE.Scene();
  const g = new THREE.BoxGeometry(1, 1, 1);
  g.deleteAttribute('uv');
  const shell = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    side: THREE.BackSide, color: 0x0A0810, roughness: 1 }));
  shell.scale.setScalar(46); env.add(shell);
  const panel = (x, y, z, sx, sy, sz, color, intensity) => {
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
      color: 0x000000, emissive: new THREE.Color(color), emissiveIntensity: intensity }));
    m.position.set(x, y, z); m.scale.set(sx, sy, sz); env.add(m);
  };
  panel(-16, 6, 0, 0.6, 11, 24, C.amber, 6);
  panel(16, 6, 0, 0.6, 11, 24, C.amber, 5);
  panel(0, 17, -10, 22, 0.6, 14, C.amber, 3);
  panel(0, 2, 18, 20, 6, 0.6, C.rose, 1.4);
  // a COOL source, or every metal reflects nothing but amber and the whole render
  // collapses to one hue, which is the fastest way to look cheap
  panel(0, 22, 6, 24, 0.6, 16, 0x7B5FC8, 2.4);   // violet overhead, so metals reflect the night
  panel(-16, 15, -18, 0.6, 9, 18, C.moon, 1.6);
  return env;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(buildEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.42;

/* ---------- generated textures: wood, rug, portraits ----------
   The manor look lives in material variety. All procedural, nothing to download. */
function makeWoodTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#241610'; g.fillRect(0, 0, 256, 256);
  for (let p = 0; p < 8; p++) {                        // planks
    const y = p * 32;
    g.fillStyle = p % 2 ? '#281911' : '#20130D';
    g.fillRect(0, y, 256, 31);
    g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(0, y + 31.5); g.lineTo(256, y + 31.5); g.stroke();
    for (let i = 0; i < 40; i++) {                     // grain
      g.strokeStyle = `rgba(${14 + Math.random() * 26 | 0},${9 + Math.random() * 14 | 0},6,0.25)`;
      const gy = y + 3 + Math.random() * 26;
      g.beginPath(); g.moveTo(Math.random() * 256, gy);
      g.lineTo(Math.random() * 256, gy + (Math.random() - 0.5) * 3); g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function makeRugTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#3C0B14'; g.fillRect(0, 0, 512, 1024);          // oxblood field
  const border = (inset, w, col) => {
    g.strokeStyle = col; g.lineWidth = w;
    g.strokeRect(inset, inset, 512 - inset * 2, 1024 - inset * 2);
  };
  border(14, 6, 'rgba(200,162,74,0.8)');
  border(30, 3, 'rgba(200,162,74,0.5)');
  border(44, 10, 'rgba(42,16,48,0.9)');
  border(58, 2.5, 'rgba(200,162,74,0.55)');
  // medallion rows: diamonds and florets, dim enough to read as weave at night
  for (let row = 0; row < 5; row++) {
    const y = 150 + row * 180;
    for (let col = 0; col < 3; col++) {
      const x = 128 + col * 128;
      g.strokeStyle = 'rgba(200,162,74,0.45)'; g.lineWidth = 2.5;
      g.beginPath();
      g.moveTo(x, y - 52); g.lineTo(x + 44, y); g.lineTo(x, y + 52); g.lineTo(x - 44, y);
      g.closePath(); g.stroke();
      g.strokeStyle = 'rgba(122,68,90,0.65)';
      g.beginPath(); g.arc(x, y, 20, 0, Math.PI * 2); g.stroke();
      g.fillStyle = 'rgba(233,169,184,0.30)';
      g.beginPath(); g.arc(x, y, 6, 0, Math.PI * 2); g.fill();
    }
  }
  for (let i = 0; i < 2600; i++) {                     // weave noise
    g.fillStyle = `rgba(0,0,0,${0.04 + Math.random() * 0.08})`;
    g.fillRect(Math.random() * 512, Math.random() * 1024, 2, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makePortraitTexture(seed) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 172;
  const g = c.getContext('2d');
  g.fillStyle = '#100A0E'; g.fillRect(0, 0, 128, 172);
  // the sitter is a SUGGESTION: a pale oval and shoulders under heavy varnish.
  // Anything more drawn would read as bad art; this reads as an old dark painting.
  const cx = 64 + ((seed * 37) % 11) - 5, cy = 62 + ((seed * 53) % 9) - 4;
  const head = g.createRadialGradient(cx, cy, 2, cx, cy, 26);
  head.addColorStop(0, 'rgba(196,168,140,0.34)');
  head.addColorStop(0.6, 'rgba(150,122,100,0.16)');
  head.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = head;
  g.beginPath(); g.ellipse(cx, cy, 20, 26, 0, 0, Math.PI * 2); g.fill();
  const sh = g.createLinearGradient(0, cy + 24, 0, 172);
  sh.addColorStop(0, 'rgba(96,74,80,0.30)');
  sh.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sh;
  g.beginPath(); g.ellipse(cx, cy + 62, 44, 40, 0, Math.PI, 0); g.fill();
  const vin = g.createRadialGradient(64, 80, 30, 64, 86, 120);
  vin.addColorStop(0, 'rgba(0,0,0,0)');
  vin.addColorStop(1, 'rgba(0,0,0,0.78)');
  g.fillStyle = vin; g.fillRect(0, 0, 128, 172);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---------- scanned PBR sets (CC0, Poly Haven, vendored offline) ----------
   The "cel shaded" read came from large flat-colour surfaces under smooth light:
   nothing for the eye to grip. Real scanned albedo + normals break it. Diffuse maps
   are MIXR-compressed WebP; the normal and ARM maps ship as the source JPGs, because
   lossy WebP chroma subsampling visibly corrupts normal data (deviation from rule 9a
   noted openly, not silently). */
const texLoader = new THREE.TextureLoader();
function loadTex(url, { srgb = false, rx = 1, ry2 = 1 } = {}) {
  const t = texLoader.load(url);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry2);
  t.anisotropy = 8;
  return t;
}
const floorDiff = loadTex('textures/compressed/dark_wooden_planks_diff_2k.webp', { srgb: true, rx: 7, ry2: 18 });
const floorNrm  = loadTex('textures/compressed/dark_wooden_planks_nor_gl_2k.webp', { rx: 7, ry2: 18 });
const floorArm  = loadTex('textures/compressed/dark_wooden_planks_arm_2k.webp', { rx: 7, ry2: 18 });
/* the walls wear a GOTHIC QUATREFOIL JACQUARD (a real CC0 scan): period-correct for a
   manor, on-brief for A Dark Night, and infinitely richer than tinted plaster */
const wallDiff  = loadTex('textures/compressed/quatrefoil_jacquard_fabric_diff_2k.webp', { srgb: true, rx: 7, ry2: 2.4 });
const wallNrm   = loadTex('textures/compressed/quatrefoil_jacquard_fabric_nor_gl_2k.webp', { rx: 7, ry2: 2.4 });
const woodDiff  = loadTex('textures/compressed/dark_wood_diff_1k.webp', { srgb: true, rx: 2, ry2: 2 });
const woodNrm2  = loadTex('textures/compressed/dark_wood_nor_gl_1k.webp', { rx: 2, ry2: 2 });
const woodArm   = loadTex('textures/compressed/dark_wood_arm_1k.webp', { rx: 2, ry2: 2 });
const rugDiff   = loadTex('textures/compressed/fabric_pattern_07_col_1_2k.webp', { srgb: true, rx: 2, ry2: 9 });
const rugNrm    = loadTex('textures/compressed/fabric_pattern_07_nor_gl_2k.webp', { rx: 2, ry2: 9 });
const velDiff   = loadTex('textures/compressed/velour_velvet_diff_1k.webp', { srgb: true, rx: 3, ry2: 3 });
const velNrm    = loadTex('textures/compressed/velour_velvet_nor_gl_1k.webp', { rx: 3, ry2: 3 });
/* the plaster normal does double duty: tooth for the stone, and a faint hammered
   break-up on the metals so their specular band stops running laser-clean */
const stoneNrm  = loadTex('textures/compressed/painted_plaster_wall_nor_gl_1k.webp', { rx: 3, ry2: 3 });
const metalNrm  = loadTex('textures/compressed/painted_plaster_wall_nor_gl_1k.webp', { rx: 7, ry2: 7 });

/* ---------- materials ---------- */
const MAT = {
  gold:   new THREE.MeshPhysicalMaterial({ color: C.gold, metalness: 1, roughness: 0.24, normalMap: metalNrm, normalScale: new THREE.Vector2(0.22, 0.22), side: THREE.DoubleSide }),
  goldHi: new THREE.MeshPhysicalMaterial({ color: C.goldHi, metalness: 1, roughness: 0.14, normalMap: metalNrm, normalScale: new THREE.Vector2(0.16, 0.16), side: THREE.DoubleSide }),
  stone:  new THREE.MeshPhysicalMaterial({ color: C.stone, metalness: 0, roughness: 0.86, side: THREE.DoubleSide }),
  // cool pale stone for tracery, surrounds and the frontispiece
  stoneLight: new THREE.MeshPhysicalMaterial({ color: 0x6E6678, metalness: 0, roughness: 0.8, normalMap: stoneNrm, normalScale: new THREE.Vector2(0.85, 0.85), side: THREE.DoubleSide }),
  // plaster carries the scan; the purple lives in the TINT over it, so the wall has
  // grain and patching instead of one flat "cel" colour
  wall:   new THREE.MeshPhysicalMaterial({ map: wallDiff, color: 0x4A3A62, normalMap: wallNrm,
    normalScale: new THREE.Vector2(1.0, 1.0), metalness: 0, roughness: 0.85, side: THREE.DoubleSide }),
  // manor wood: real dark-wood scan on beams, balconies, posts, furniture, the door
  woodDark: new THREE.MeshPhysicalMaterial({ map: woodDiff, color: 0x6E5E52, normalMap: woodNrm2,
    normalScale: new THREE.Vector2(1.0, 1.0), roughnessMap: woodArm, roughness: 1.0,
    metalness: 0, side: THREE.DoubleSide }),
  door:   new THREE.MeshPhysicalMaterial({ map: woodDiff, color: 0xA08A78, normalMap: woodNrm2,
    normalScale: new THREE.Vector2(1.15, 1.15), roughnessMap: woodArm, roughness: 1.0,
    metalness: 0, side: THREE.DoubleSide }),
  // pewter for the chandeliers and the door ironwork, per the reference's dark metal
  iron:   new THREE.MeshPhysicalMaterial({ color: 0x4A4550, metalness: 0.9, roughness: 0.38, normalMap: metalNrm, normalScale: new THREE.Vector2(0.32, 0.32), side: THREE.DoubleSide }),
  // REAL velour scan under the plum tint: pile direction and nap, not flat colour
  velvet: new THREE.MeshPhysicalMaterial({
    map: velDiff, color: 0x6A4A6E, normalMap: velNrm, normalScale: new THREE.Vector2(1.05, 1.05),
    roughness: 0.95, metalness: 0,
    sheen: 0.9, sheenRoughness: 0.35, sheenColor: new THREE.Color(0xE8A98A), side: THREE.DoubleSide }),
  dark:   new THREE.MeshPhysicalMaterial({ map: woodDiff, color: 0x35291F, normalMap: woodNrm2, normalScale: new THREE.Vector2(0.5, 0.5), metalness: 0, roughness: 0.8, side: THREE.DoubleSide }),
  wax:    new THREE.MeshPhysicalMaterial({ color: 0xEDE4D3, roughness: 0.55, metalness: 0 }),
  silver: new THREE.MeshPhysicalMaterial({ color: 0xC9CDD4, metalness: 1, roughness: 0.28, normalMap: metalNrm, normalScale: new THREE.Vector2(0.2, 0.2), side: THREE.DoubleSide }),
  moonGlow: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: new THREE.Color(0xC7C4E4), emissiveIntensity: 0.9, side: THREE.DoubleSide }),
  portraitTex: [0, 1, 2, 3].map(makePortraitTexture),
  /* the alpha ramp that makes a light shaft read as AIR and not as a solid cone:
     opaque in the window mouth, gone before it reaches the floor */
  shaftFade: (() => {
    const c = document.createElement('canvas');
    c.width = 4; c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0.00, 'rgba(255,255,255,1)');
    grad.addColorStop(0.35, 'rgba(255,255,255,0.45)');
    grad.addColorStop(0.75, 'rgba(255,255,255,0.10)');
    grad.addColorStop(1.00, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 4, 256);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })(),
  /* THE SPONSOR BOARDS: the two big gilt frames flanking the grand door. JoJo's call
     2026-08-13 - they were dark portraits doing nothing; they are the logo positions.
     Drawn as type immediately, repainted with the real gold wordmark when it loads. */
  logoTex: [
    { name: 'MIXR', src: 'textures/brand/compressed/mixr_logo.webp', tone: 'flat', w: 486 },   // matched to the ENDLESS RIVER mark's visual weight, not to its raw width
    /* ENDLESS RIVER's real mark is cyan and pink with a hard black offset shadow, which
       next to gilt frames and candlelight would read as a sticker someone left on the
       wall (JoJo: "his logo will stick out like a sore thumb, render it into the room's
       gold"). It is NOT flat-filled: a source-in fill would collapse the wordmark and its
       shadow into one gold blob and throw away the thing that makes the mark recognisable.
       Instead the two letter colours map to two golds and the shadow to a dark bronze, so
       the construction survives the recolour. */
    { name: 'ENDLESS RIVER', src: 'textures/brand/compressed/endless_river.webp', tone: 'two', w: 566 },   // the source PNG is 1080 square with the mark inset, so this is bigger than it looks
  ].map(spec => {
    const c = document.createElement('canvas');
    c.width = 640; c.height = 860;
    const g = c.getContext('2d');
    const paint = (img) => {
      const bg = g.createLinearGradient(0, 0, 0, 860);
      bg.addColorStop(0, '#241432'); bg.addColorStop(1, '#160C20');
      g.fillStyle = bg; g.fillRect(0, 0, 640, 860);
      g.strokeStyle = 'rgba(200,162,74,0.35)'; g.lineWidth = 5;
      g.strokeRect(34, 34, 572, 792);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      if (img) {
        const lw = spec.w, lh = lw * (img.height / img.width);
        g.drawImage(img, 320 - lw / 2, 430 - lh / 2, lw, lh);
      } else {
        // placeholder type until the real mark decodes, so the board is never blank
        const serif = "'Cormorant Garamond','Playfair Display',Georgia,serif";
        try { g.letterSpacing = '10px'; } catch {}
        g.font = `600 ${spec.name === 'MIXR' ? 96 : 58}px ${serif}`;
        g.fillStyle = '#C8A24A';
        if (spec.name === 'ENDLESS RIVER') {
          g.fillText('ENDLESS', 320, 396); g.fillText('RIVER', 320, 470);
        } else g.fillText(spec.name, 320, 430);
        try { g.letterSpacing = '0px'; } catch {}
      }
      // a soft candle-catch across the board so it is never a flat card
      const sh = g.createLinearGradient(0, 0, 640, 860);
      sh.addColorStop(0, 'rgba(255,214,150,0.07)');
      sh.addColorStop(0.5, 'rgba(255,255,255,0)');
      g.fillStyle = sh; g.fillRect(0, 0, 640, 860);
    };
    paint(null);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;

    const im = new Image();
    im.onload = () => {
      const off = document.createElement('canvas');
      off.width = im.width; off.height = im.height;
      const og = off.getContext('2d', { willReadFrequently: true });
      og.drawImage(im, 0, 0);
      if (spec.tone === 'flat') {
        og.globalCompositeOperation = 'source-in';
        og.fillStyle = '#D8B25A';
        og.fillRect(0, 0, off.width, off.height);
      } else {
        /* Classify by SATURATION, not by matching the two brand colours exactly. The
           letterforms are saturated, the shadow is not, and antialiased edge pixels sit
           between the two, so a soft ramp on saturation recolours the edges correctly
           instead of leaving a cyan fringe around every letter. */
        const d = og.getImageData(0, 0, off.width, off.height), p = d.data;
        const HI = [0xEC, 0xCE, 0x84];   // lit gold, the upper word
        const LO = [0xB4, 0x89, 0x38];   // deeper gold, the lower word
        const SH = [0x1B, 0x12, 0x07];   // bronze-black, the offset shadow
        for (let i = 0; i < p.length; i += 4) {
          if (p[i + 3] < 6) continue;
          const r = p[i], gg = p[i + 1], b = p[i + 2];
          const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
          const sat = mx ? (mx - mn) / mx : 0;
          const k = Math.min(1, Math.max(0, (sat - 0.12) / 0.26));
          const L = r < 180 ? HI : LO;          // cyan word lighter, pink word deeper
          p[i]     = SH[0] + (L[0] - SH[0]) * k;
          p[i + 1] = SH[1] + (L[1] - SH[1]) * k;
          p[i + 2] = SH[2] + (L[2] - SH[2]) * k;
        }
        og.putImageData(d, 0, 0);
      }
      paint(off);
      t.needsUpdate = true;
    };
    im.onerror = () => console.warn('logo failed to load: ' + spec.src);
    im.src = spec.src;
    return t;
  }),
};
/* per-material environment response (research panel): a global 1.0 is the plastic
   look. Metals reflect most, plaster least. */
MAT.gold.envMapIntensity = 0.6; MAT.goldHi.envMapIntensity = 0.6;
MAT.silver.envMapIntensity = 0.6; MAT.iron.envMapIntensity = 0.55;
MAT.woodDark.envMapIntensity = 0.35; MAT.door.envMapIntensity = 0.35;
MAT.wall.envMapIntensity = 0.25; MAT.stone.envMapIntensity = 0.25;
MAT.stoneLight.envMapIntensity = 0.3; MAT.velvet.envMapIntensity = 0.3;

/* ---------- the room ---------- */
const { hall, wallFrames, candleSlots, herald, beams, ambient, standLights, sofaStandins, sponsorBoards } = buildHall(MAT, C);
const { W, Z0, FAR_Z, BAY } = DIMS;

/* Chandeliers: THREE ornate pewter fittings straight down the axis, per the reference.
   The room is formal now, so the centreline is where they belong; their sizes descend
   with distance so the row reads as depth, not repetition. */
const { CEIL } = DIMS;
const keyLights = [];
const chandeliers = [];
/* TWO chandeliers, not three (JoJo: "is 3 chandeliers too excessive?" - from the
   straight camera they stacked into one cluttered column). One hero over the lounge,
   one modest fitting deep by the door for depth; the gap between them lets the
   ceiling and the coffers actually read. */
/* ONE fitting, not two. The second hung at z=-30 on the same centre line, and from a
   dead-centre camera its projected box sat ENTIRELY inside the near one: measured
   [552,183,632,319] nested inside [513,11,711,328]. It was paying for 5.7k vertices, a
   point light and 8 flame sprites to render zero visible pixels. Its ILLUMINATION was
   doing real work though, so that is kept below as a bare light with no geometry. */
[[Z0 - 28, 2.7, 130]].forEach(([z, r, power], i) => {
  /* Each hangs from a GROUP pivoted at the ceiling, so rotating the group swings the
     whole fitting, its candles and its light together, like a real one on a chain. */
  const g = new THREE.Group();
  g.name = 'chandelier-' + i;
  g.position.set(0, CEIL, z);
  hall.add(g);

  /* the far fitting hangs HIGHER so it clears the sightline to the herald plaque */
  // hung higher so the near fitting sits fully ABOVE the frame edge (JoJo: it was
  // poking through the top); geometry, not camera, is what clears it for good
  const y = (11.9 + i * 1.1) - CEIL;           // body height, local to the pivot
  const l = new THREE.PointLight(C.amber, power, 70, 2);
  l.position.set(0, y, 0);
  g.add(l);
  keyLights.push({ light: l, power });

  const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, -y + 0.2, 6), MAT.iron);
  chain.name = 'chain';
  chain.position.set(0, y / 2 + 0.1, 0); g.add(chain);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 2.6, 8), MAT.iron);
  stem.position.set(0, y - 0.9, 0); g.add(stem);
  const finial = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), MAT.iron);
  finial.position.set(0, y - 2.2, 0); g.add(finial);

  const local = [];
  /* three tiers of rings, candles on every tier: the ornate multi-storey fittings of
     the reference, in dark metal so the flames read against them */
  [[r, 0, 12], [r * 0.68, -0.85, 8], [r * 0.38, -1.6, 5]].forEach(([rr, dy, n]) => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(rr, 0.065, 8, 40), MAT.iron);
    ring.rotation.x = Math.PI / 2; ring.position.set(0, y + dy, 0); g.add(ring);
    for (let k = 0; k < 6; k++) {              // S-arms out to the ring
      const a = (k / 6) * Math.PI * 2;
      const arm = new THREE.Mesh(new THREE.TorusGeometry(rr * 0.5, 0.035, 6, 14, Math.PI * 0.9), MAT.iron);
      arm.position.set(Math.cos(a) * rr * 0.5, y + dy, Math.sin(a) * rr * 0.5);
      arm.rotation.set(Math.PI / 2, 0, a + Math.PI / 2);
      g.add(arm);
    }
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2 + dy;    // each tier phased differently
      const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.06, 0.1, 8), MAT.iron);
      cup.position.set(Math.cos(a) * rr, y + dy + 0.08, Math.sin(a) * rr); g.add(cup);
      const wx = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.34, 8), MAT.wax);
      wx.position.set(Math.cos(a) * rr, y + dy + 0.3, Math.sin(a) * rr); g.add(wx);
      local.push(new THREE.Vector3(Math.cos(a) * rr, y + dy + 0.55, Math.sin(a) * rr));
    }
  });
  chandeliers.push({
    group: g, local, y, seed: i * 2.7,
    ang: new THREE.Vector2(), vel: new THREE.Vector2(),
  });
});

/* ---------- FILL THE CANDLES THE CAMERA CAN SEE, FIRST ----------
   Audited, not assumed: of 96 votive slots only 32 project inside the frame, and under
   the plain seeded shuffle 18 of the first 30 guests were lighting a candle nobody could
   ever look at. That is the activation's whole payoff quietly failing for two people in
   three: they join, they light, they look up at the wall, and nothing happened.

   The shuffle itself is still wanted, so guests never fill a neat row and a reload maps
   the same guest to the same candle. This is a STABLE PARTITION on top of it: in-frame
   slots keep their shuffled order and simply come first. Off-frame slots are not thrown
   away, because a full room still needs somewhere to put guest 40 and the sills do carry
   light into the bake. */
(() => {
  /* Against a PURPOSE-BUILT camera at the steady pose, not the live one. `camera` is
     positioned inside frame(), so at module scope it is still sitting at its constructor
     pose looking down -Z, and partitioning against that scored the wrong 32 slots: the
     first pass shipped and still left 14 of the first 30 guests invisible. It also should
     not be scored against a drifting frame, since the breathing camera moves the edges
     slightly and a slot must not change category between frames. */
  const probe = camera.clone();
  if (PORTAL) { probe.position.set(0, EYE_H, WINZ + EYE_D); probe.rotation.set(0, 0, 0); }
  else { probe.position.set(0, 4.6, 2); probe.lookAt(0, 5.6, FAR_Z); }
  probe.updateMatrixWorld(true);
  probe.updateProjectionMatrix();
  const seen = p => {
    const v = p.clone().project(probe);
    // a small inset, so a candle half off the edge does not count as a payoff
    return v.z < 1 && Math.abs(v.x) <= 0.96 && Math.abs(v.y) <= 0.96;
  };
  const inFrame = candleSlots.filter(seen);
  const off = candleSlots.filter(p => !seen(p));
  candleSlots.length = 0;
  candleSlots.push(...inFrame, ...off);
  console.log('candles: ' + inFrame.length + ' of ' + (inFrame.length + off.length) + ' in frame, filled first');
})();

/* the fixed lights that actually carry the illumination */
const fill = new THREE.PointLight(C.rose, 7, 30, 2);
fill.position.set(0, 5, 3); hall.add(fill);
/* The deleted second chandelier's LIGHT, kept without its geometry. The fitting itself
   was invisible behind the near one, but it was the only warm source over the far third
   of the hall, and dropping it outright would have darkened the door and the statues. A
   bare light is the honest version of a fixture you cannot see. */
const farKey = new THREE.PointLight(C.amber, 62, 70, 2);
farKey.position.set(0, 11.0, -30); hall.add(farKey);

   it, so leaving the hemisphere where it was would double-count the fill and flatten

hall.add(new THREE.HemisphereLight(0x4A2E6E, 0x0A0714, 0.05));
/* two symmetric moon washes off the window walls: the formal room lights evenly */
for (const side of [-1, 1]) {

/* the frontispiece glow: warm on the stone and the door, so the far wall is an arrival */

doorGlow.position.set(0, 6.5, FAR_Z + 6); hall.add(doorGlow);

/* THE MOON KEY. One shadow-casting directional, angled through the left gallery the

   patterns on the floor, the balcony grounds itself on the wall, the settee and

   cannot occlude it; only what stands between it and the floor casts. */
const moonKey = new THREE.DirectionalLight(C.moon, 1.85);
moonKey.position.set(-11.5, 13.5, -8);
moonKey.target.position.set(8, 0, -16);
moonKey.castShadow = true;
moonKey.shadow.mapSize.set(LITE ? 1024 : 2048, LITE ? 1024 : 2048);
moonKey.shadow.camera.near = 0.5;
moonKey.shadow.camera.far = 60;
moonKey.shadow.camera.left = -26; moonKey.shadow.camera.right = 26;
moonKey.shadow.camera.top = 20;  moonKey.shadow.camera.bottom = -20;
moonKey.shadow.bias = -0.0006;
moonKey.shadow.radius = 5;

/* A SECOND MOON RAKE off the right gallery, deliberately NOT shadow casting.
   The room is symmetric architecture, so a single rake from the left left the right

const moonFill = new THREE.DirectionalLight(C.moon, 0.85);
moonFill.position.set(12.5, 12.0, -14);
moonFill.target.position.set(-6, 0, -26);
hall.add(moonFill); hall.add(moonFill.target);

/* every solid casts and receives; glass panes and glow sprites must not */
hall.traverse(o => {
  if (o.isMesh) {

    o.castShadow = !glass;

   window is a soft rectangular source, and four of them give the walls and furniture

/* ---------- the floor: dark oak and a woven rug, NOT a mirror ----------
   JoJo: "the light reflections look kind of weird". They did: the full mirrored-clone
   floor read as CG water. A manor floor is waxed wood: a broad specular sheen from
   clearcoat, no mirror image. The clone is deleted outright, which also halves the
   scene's draw cost. */
/* Normal maps from the same canvases: a Sobel pass over luminance turns the plank
   lines and weave into surface relief, which is what makes raking candlelight and the
   moon key actually GRIP the materials instead of sliding over flat colour. */
function normalFromCanvas(srcTex, strength = 1.2) {
  const src = srcTex.image;
  const w = src.width, h = src.height;
  const sctx = src.getContext('2d');
  const d = sctx.getImageData(0, 0, w, h).data;
  const lum = (x, y) => {
    x = (x + w) % w; y = (y + h) % h;
    const i = (y * w + x) * 4;
    return (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
  };
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const octx = out.getContext('2d');
  const img = octx.createImageData(w, h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const dx = (lum(x + 1, y) - lum(x - 1, y)) * strength;
      const dy = (lum(x, y + 1) - lum(x, y - 1)) * strength;
      const inv = 1 / Math.hypot(dx, dy, 1);
      const i = (y * w + x) * 4;
      img.data[i] = (-dx * inv * 0.5 + 0.5) * 255;
      img.data[i + 1] = (-dy * inv * 0.5 + 0.5) * 255;
      img.data[i + 2] = inv * 255;
      img.data[i + 3] = 255;
    }
  octx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(out);
  t.wrapS = srcTex.wrapS; t.wrapT = srcTex.wrapT;
  t.repeat.copy(srcTex.repeat);
  return t;
}

/* the floor wears the real scan: worn dark oak, its own roughness variation from the
   ARM map (three.js reads roughness from G, exactly how Poly Haven packs it) */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(2 * DIMS.W + 2, 70),

    map: floorDiff, color: 0x9A8A7E, roughness: 0.62, roughnessMap: floorArm,
    metalness: 0, normalMap: floorNrm, normalScale: new THREE.Vector2(1.35, 1.35),
    clearcoat: 0.55, clearcoatRoughness: 0.12, envMapIntensity: 0.55, side: THREE.DoubleSide }),
);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, -13);
floor.receiveShadow = true;
scene.add(floor);

/* the great rug down the axis, oxblood and gold, matte like cloth should be */

const rug = new THREE.Mesh(
  /* 43.9 long, not 40. The runner ended at z=-32 while the door steps start at z=-35.85,
     so 3.85m of bare board sat in the dead centre of the shot, exactly where the eye is
     being led. One quad, no new mesh. */
  new THREE.PlaneGeometry(7.2, 43.9),
  new THREE.MeshPhysicalMaterial({
    // a REAL woven scan, tinted oxblood: the procedural canvas rug read as printed paper
    map: rugDiff, color: 0x552028, roughness: 0.95, metalness: 0,
    normalMap: rugNrm, normalScale: new THREE.Vector2(1.1, 1.1),
    // sheen nearly off: at 0.3 the grazing camera coated the whole rug salmon
    sheen: 0.1, sheenRoughness: 0.85, sheenColor: new THREE.Color(C.rose), side: THREE.DoubleSide }),

rug.position.set(0, 0.02, -13.95);   // so the far end lands on the bottom step nose

/* ---------- candles ---------- */
/* ---------- REAL MODELLED FURNITURE ----------
   The single biggest quality step in this build. Everything above builds the ARCHITECTURE
   out of primitives, which is correct: walls, beams, coffers and window surrounds really
   are boxes and tori, and a box wall reads as a wall. Furniture does not survive the same
   treatment. A sofa made of five rounded boxes has the wrong SILHOUETTE, and silhouette
   is read before shading, which is why no amount of grading ever fixed it.

   These are CC0 assets with real topology and real PBR maps, shipped local. The
   primitives stay in the scene as stand-ins and are hidden only once a model actually
   lands, so a machine that loses the models folder still shows a furnished room. */
async function dressRoom() {
  const jobs = [];
  /* ?nomodels=1 runs the room on the primitive stand-ins alone. It is the honest
     before/after switch AND the venue fallback: if the models folder ever goes missing
     on the projector machine, this is the mode it degrades into, so it has to stay
     working rather than being a debug flag that rots. */
  if (qs.get('nomodels') === '1') return { total: 0, failed: 0, skipped: true };

  /* The two chandeliers. Keep OUR chain and point light, swap the body, and hand the
     glow over to the asset's own lamp material.

     The first attempt kept the primitive's 25 sprite flames and only replaced the body.
     Cropped in, that was plainly wrong twice over: the sprites sat at the OLD cup
     positions, so they floated in a blob with no fitting under them, and the real body
     rendered near black because the only light in range was the point light buried
     inside it, lighting nothing but its own interior. The asset ships a
     `..._lamp` material carrying an amber emissiveFactor, which is the fixture telling
     us where its own flames are. Driving that beats scattering sprites near it. */
  chandeliers.forEach((ch, i) => {
    const prim = ch.group.children.filter(o => o.isMesh && o.name !== 'chain');
    /* WIDTH AND BOTTOM EDGE, both explicit. The first pass fitted 4.4m wide and pinned
       the TOP, which hung the fixture down to y=6.6 and cropped it against the top of
       frame, so the hero shot opened on the underside of a lamp. Sized to read as a
       fixture in the room, and hung so its bottom edge clears the far arch. */
    /* SIZED BY HEIGHT, HUNG BY BOTTOM EDGE, both solved against the camera rather than
       chosen by eye. With the camera at y=4.64 and the top-of-frame ray 21.3 degrees up,
       the tallest point visible at distance d is 4.64 + 0.390d. The hero used to hang at
       z=-7 where that ceiling is 8.12m, so a fitting on a 15.2m ceiling could not be in
       shot at ANY size: its projected box ran 1512px off the top of a 982px frame and the
       only chandelier ever visible was the far one. Solved: at z=-18 the limit is 12.41m,
       so a 3.9m fitting hung with its bottom at 7.8 spans screen y 48..312, fully in
       frame and clear of the herald frame which starts at 316. */
    const height = i === 0 ? 3.9 : 2.8;
    const bottom = (i === 0 ? 7.8 : 9.6) - CEIL;      // local to the ceiling pivot
    jobs.push(place('chandelier', {
      parent: ch.group, fit: { axis: 'y', metres: height },
      // a light living INSIDE the fitting would shadow the whole room black through it
      cast: false, envMapIntensity: 0.9,
      onEach: o => {
        hangBottomAt(o, bottom);
        for (const p of prim) p.visible = false;
        /* THE CHAIN HAS TO REACH THE FITTING. It was built for the primitive body at a
           hardcoded height, so once the model was sized and hung by its bottom edge the
           chain stopped 1.23m short and the chandelier floated unattached under it. That
           gap opens further as the fitting sways, because a swinging chain lifts its own
           lowest point. Derive it: the chain spans the ceiling (local 0) down to the
           fitted top, which is exactly bottom + height because we fit on the y axis. */
        const chain = ch.group.children.find(c2 => c2.name === 'chain');
        if (chain) {
          const top = bottom + height, len = Math.max(0.2, -top);
          chain.geometry.dispose();
          chain.geometry = new THREE.CylinderGeometry(0.05, 0.05, len, 6);
          chain.position.set(0, top + len / 2, 0);
        }
        ch.local.length = 0;              // no sprite flames at the OLD cup positions
        o.traverse(m => {
          if (!m.isMesh) return;
          for (const mat of (Array.isArray(m.material) ? m.material : [m.material])) {
            /* THE GLASS GLOWS TOO. This asset is an enclosed LANTERN: its lamp geometry
               sits at y 9.11..9.60 entirely inside the body, and the 12 flame sprites
               derived from it end up a 0.15m cluster behind the panels where nothing can
               see them. So the fitting read as a dark bronze ornament hanging in a room
               whose entire subject is candlelight. Real lanterns are read by their LIT
               PANELS, not by a visible wick, so the glass carries the amber and the
               whole shade comes alive. */
            if (mat && /glass/i.test(mat.name || '')) {
              mat.emissive = new THREE.Color(C.amber);
              mat.emissiveIntensity = 0.85;
              (ch.glass = ch.glass || []).push(mat);
              continue;
            }
            if (!mat || !/lamp/i.test(mat.name || '')) continue;
            /* Emissive comes out of glTF at 1.0, which is a flat cream card. Push it
               well past 1 so it survives tone mapping and trips the bloom threshold,
               the way a real flame does against a dark room. */
            mat.emissiveIntensity = 5.0;
            mat.toneMapped = false;
            (ch.lamps = ch.lamps || []).push(mat);
          }
        });
        /* Sprite flames back ON THE ASSET'S OWN LAMPS. Dropping them entirely cost the
           room its warmth, because those sprites were carrying the bloom that made the
           fitting read as lit rather than as a dark ornament. The lamp material's own
           bounding box says where they belong, so they are never guessed again. */
        const lb = partBox(o, /lamp/i);
        if (lb) {
          const c = lb.getCenter(new THREE.Vector3());
          const s = lb.getSize(new THREE.Vector3());
          const rr = Math.max(s.x, s.z) * 0.34;
          const n = i === 0 ? 12 : 8;
          for (let k = 0; k < n; k++) {
            const a = (k / n) * Math.PI * 2;
            ch.local.push(new THREE.Vector3(c.x + Math.cos(a) * rr, c.y + s.y * 0.18,
                                            c.z + Math.sin(a) * rr));
          }
        }
        /* the point light belongs at the LAMP ring, not the body centre, so it throws
           light down onto the arms and up onto the coffers instead of into its own shell */
        const l = ch.group.children.find(c2 => c2.isLight);
        if (l && lb) l.position.y = lb.getCenter(new THREE.Vector3()).y;
      },
    }));
  });

  /* the sofas, at the exact footprints the primitives held so the layout is unchanged */
  for (const s of sofaStandins) {
    jobs.push(place('sofa', {
      parent: hall, position: [s.x, 0, s.z], rotationY: s.ry,
      fit: { axis: 'auto', metres: s.len }, seatTo: 0.03, envMapIntensity: 0.45,
      onEach: () => { s.group.visible = false; },
    }));
  }

  /* THE STATUES, brought forward and made much taller (JoJo: "what are those next to
     the door? statues? can we bring those up and make them taller").

     They were 3.4m tall parked at z=-36.6, flat against the far wall, where they
     occupied 1.7 percent of the frame and read as ornaments on a shelf. Two things were
     wrong. First the depth: the floor from z=-16 to -32 held almost nothing, so the one
     piece of real sculpted geometry in the room was hiding in the busiest band instead
     of anchoring the empty one. Second the size: this hall is 15.2m to the ceiling, and
     nothing under about 5m reads as architecture at that scale.

     A pedestal, not a box. The urn plinths nearby are single rounded boxes and they are
     the cheapest-looking thing in the frame, so these get a real profile: a spreading
     base, a die, and a cap that oversails, which is what makes stone read as stone in
     silhouette before any texture is sampled. */
  function pedestal(x, z, h, w, ry = 0) {
    const g = new THREE.Group();
    const put = (bw, bh, bd, y, mat) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), mat);
      m.position.set(0, y, 0); m.castShadow = true; m.receiveShadow = true;
      g.add(m);
    };
    /* DARK stone, not the light window-surround stone. There are eight of these now,
       and in a room lit only by candles a pale box is the brightest thing at floor level,
       so the cheapest geometry in the frame was also the loudest. Only the thin courses
       catch the light, which is how real mouldings read: edges lit, faces in shadow. */
    put(w * 1.30, h * 0.09, w * 1.30, h * 0.045, MAT.stone);        // base slab
    put(w * 1.14, h * 0.07, w * 1.14, h * 0.125, MAT.stoneLight);   // lower torus course
    put(w,        h * 0.66, w,        h * 0.49,  MAT.stone);        // the die
    put(w * 1.16, h * 0.09, w * 1.16, h * 0.865, MAT.stoneLight);   // cap, oversailing
    put(w * 1.28, h * 0.05, w * 1.28, h * 0.935, MAT.stone);        // abacus
    g.userData.topY = h * 0.96;   // what stands on this must SIT here, not near here
    const band = new THREE.Mesh(new THREE.BoxGeometry(w * 1.02, h * 0.02, w * 1.02), MAT.gold);
    band.position.set(0, h * 0.80, 0); g.add(band);
    g.position.set(x, 0, z);
    /* Turned to match whatever stands on it. A square cap under a statue rotated 35deg
       leaves the base corners hanging in mid air, which is what read as floating even
       after the cap was widened: the fix is to align the plinth, not to keep widening. */
    g.rotation.y = ry;
    hall.add(g);
    return g;
  }
  for (const side of [-1, 1]) {
    /* SOLVED AGAINST THE SPONSOR FRAMES, not nudged by eye. The MIXR panel occupies
       screen x 230..404 with its wordmark centred at 317. A statue is much nearer the
       camera than the far wall, so it covers far more screen than its world offset
       suggests: at x=5.6 it spanned 200..373 and sat straight across the mark, which is
       the commercial payload of the entire activation. At x=8.0, z=-25 it spans
       109..269, clear of the mark and still fully inside the frame. */
    const px = side * 8.0, pz = -25;      // in the band that read as empty, clear of the marks
    const PED = 1.5;   // lower and MUCH wider: a sculpture plinth, not a column
    /* The statue is 1.477 x 1.740 x 1.564 native, so a 5.4m fit gives a 4.58 x 4.85m base.
       On the old 2.78m cap it cantilevered off both sides and read as floating. 4.2 gives
       a 4.87m cap, which carries it. Height comes down so it does not become a tower. */
    const sRot = -side * 0.62;
    pedestal(px, pz, PED, 4.2, sRot);
    jobs.push(place('statue', {
      parent: hall, position: [px, 0, pz], rotationY: sRot,   // turned to the aisle
      fit: { axis: 'y', metres: 5.4 }, seatTo: PED, envMapIntensity: 0.55,
    }));
  }

  /* THE SPONSOR BOARDS get a real carved frame. These are the logo positions, the one
     part of the room that exists to be photographed and to be seen in a client's
     recap, so a flat gold rectangle around a mark is the worst place to economise.
     The canvas keeps its texture; only the primitive rails go. */
  sponsorBoards.forEach((b, bi) => {
    jobs.push(place('frame', {
      parent: hall, position: [b.x, b.y, b.z + 0.06], rotationY: 0,
      fit: { axis: 'y', metres: b.h + 1.05 }, envMapIntensity: 0.75,
      onEach: o => {
        /* A frame is the one asset where a non-uniform scale is honest: real frames are
           milled to the picture, not to a fixed aspect. Squeeze x to the board so the
           logo sits inside the rebate rather than floating in a frame of the wrong shape. */
        const sz = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3());
        if (sz.x > 1e-6) o.scale.x *= (b.w + 1.05) / sz.x;

        /* The asset ships its own painting on a separate quad sitting exactly in the
           rebate. Re-texturing that quad in place came out MIRRORED and low, because the
           author's UVs are flipped in u and do not fill v. Rather than guess at a UV
           transform that a future asset swap would silently break, MEASURE the rebate
           and build our own quad in it: the frame supplies the position, we supply the
           mapping, and a logo is never handed to UVs we do not control. */
        /* Re-derive the world matrices after the squeeze above. Measuring the child
           straight away read the PRE-squeeze size (a 7.96m mark in a 5.35m frame),
           because changing a parent's scale does not touch a child's cached
           matrixWorld, and updating the child alone composes against the stale parent. */
        o.updateMatrixWorld(true);
        let slot = null;
        o.traverse(m => { if (m.isMesh && /canvas/i.test(m.material?.name || '')) slot = m; });
        if (slot) {
          const bb = new THREE.Box3().setFromObject(slot);
          const c = bb.getCenter(new THREE.Vector3());
          const sz = bb.getSize(new THREE.Vector3());
          slot.visible = false;
          const art = new THREE.Mesh(
            new THREE.PlaneGeometry(sz.x, sz.y),
            new THREE.MeshStandardMaterial({
              map: MAT.logoTex[bi % MAT.logoTex.length], roughness: 0.92, metalness: 0.0,
            }));
          // world space, so the frame's own non-uniform scale cannot squash the mark
          art.name = 'sponsor-art-' + bi;
          art.position.set(c.x, c.y, bb.max.z + 0.012);
          hall.add(art);
        }
        b.group.visible = false;          // our primitive rails and canvas both go
      },
    }));
  });

  /* candelabra on the lounge tables, replacing the turned-cylinder versions */
  for (const [x, z, ry] of [[-5.2, -8.4, 0.5], [5.0, -8.8, -0.7]]) {
    jobs.push(place('candelabra', {
      parent: hall, position: [x, 0.86, z], rotationY: ry,
      fit: { axis: 'y', metres: 0.62 }, envMapIntensity: 0.8,
    }));
  }

  /* TORCHERES DOWN THE RUNNER (JoJo: "the space still feels so empty").
     The measured hole was z=-16 to -32, roughly sixteen metres of floor carrying almost
     nothing while the near lounge carried ninety-five meshes. A hall this long does not
     get fixed by scattering objects into the gap; it gets fixed by giving the gap the
     same RHYTHM the building already has, so the eye is walked down to the door instead
     of skipping across a bare red runner.

     These are the tabletop brass candleholders raised onto pedestals, which is what a
     floor torchere actually is. They earn their place three times over: they fill the
     dead band, every one of them carries live flames in a room whose whole subject is
     candlelight, and their pool of light lands ON the runner, which is the surface that
     was reading as empty. Staggered left against right so the row never reads as a
     mirrored pair, which is the instancing tell. */
  /* z=-13.5 on the left is GONE: the deep left sofa occupies x -8.08..-4.32, z -17.49..-11.83
     and the torchere stood inside it, overlapping by its entire 0.70 x 1.48 footprint.
     Moved out to -18.6 where the row still reads as evenly spaced. */
  const TORCH = [[-1, -18.6], [1, -17.5], [-1, -22.6], [1, -25.5], [-1, -29.5], [1, -33.5]];
  for (const [side, tz] of TORCH) {
    const tx = side * 5.5;                      // just outboard of the runner edge at 4.5
    /* seated on the pedestal CAP, not at its nominal height: the cap top is 0.96h, so
       placing at h left the candelabrum hovering 7cm in the air on every one of them */
    const ped = pedestal(tx, tz, 1.7, 0.56);
    const topY = ped.userData.topY;
    jobs.push(place('candelabra', {
      parent: hall, position: [tx, topY, tz], rotationY: side * 0.9 + tz * 0.07,
      fit: { axis: 'y', metres: 1.15 }, envMapIntensity: 0.8,
      onEach: () => {
        // register the flames so these are lit furniture from the first frame, never dark props
        ambient.push(new THREE.Vector3(tx, topY + 1.15 + 0.12, tz));
        standLights.push(new THREE.Vector3(tx, topY + 1.15, tz));
      },
    }));
  }

  const done = await Promise.allSettled(jobs);
  const bad = done.filter(d => d.status === 'rejected');
  if (bad.length) console.warn('models: ' + bad.length + ' of ' + jobs.length + ' failed', bad[0].reason);
  return { total: jobs.length, failed: bad.length };
}

/* Gate the bake on the dressing pass. The bake writes irradiance into VERTICES, so a
   model that arrives after it runs would be lit by the real lights but carry none of
   the baked bounce, and would sit in the room looking flatter than everything near it.
   The race is the safety valve: a missing models folder must not hang the projector. */
let modelStats = { total: 0, failed: 0 };
try {
  modelStats = await Promise.race([
    dressRoom(),
    new Promise(r => setTimeout(() => r({ total: 0, failed: -1 }), 12000)),
  ]);
  if (modelStats.failed === -1) console.warn('models: timed out, running on stand-ins');
  else console.log('models: ' + (modelStats.total - modelStats.failed) + '/' + modelStats.total + ' placed');
} catch (e) { console.warn('models: dressing pass failed', e); }
window.__models = modelStats;
// lift the loading screen the instant the room is dressed, straight from the async flow,
// not on a poll: a throttled or suspended timer must never be what stands between the guest
// and the room. The IIFE below still carries a hard-cap fallback for the missing-models case.
if (window.__liftSplash) window.__liftSplash();

/* ---------- GIVE EVERY GUEST CANDLE AN ACTUAL CANDLE (JoJo: "tiny floating candles") ----------
   He was right, and it was structural rather than cosmetic. `candleSlots` only ever held
   a POSITION: nothing in the build put wax under any of the 96 of them, so a guest lit
   their candle and got a flame sprite hanging in mid air. The sill slots were the worst,
   sitting 0.65m above the ledge they were supposed to be standing on. Reordering the fill
   to favour on-camera slots, done just above, dragged more of them into shot, which is
   why this surfaced now rather than earlier.

   Seated by RAYCAST rather than by arithmetic. The slots live on three different surfaces
   built in three different places (window ledges, balcony rails, door steps), so any
   hardcoded offset is three chances to be wrong and it rots the moment a surface moves.
   Dropping a ray and standing the votive on whatever it lands on is correct by
   construction, and it costs one pass at load.

   One InstancedMesh, so 96 votives are a single draw call. */
const votives = (() => {
  /* WITHOUT THIS EVERY RAY LIES. Raycasting reads matrixWorld, and nothing has rendered
     yet at module scope, so every window group still carried an identity matrix: the sills
     were effectively sitting at the origin and each probe returned the same two surfaces no
     matter which x it asked about. The audit read '40 misses' and looked like bad slot
     positions, when the real fault was asking the scene where things are before it knows. */
  hall.updateMatrixWorld(true);
  const ray = new THREE.Raycaster();
  ray.far = 4.0;
  const down = new THREE.Vector3(0, -1, 0);
  const dish = new THREE.CylinderGeometry(0.115, 0.135, 0.045, 12).translate(0, 0.022, 0);
  const wax  = new THREE.CylinderGeometry(0.085, 0.09, 0.20, 12).translate(0, 0.145, 0);
  const geo  = mergeGeometries([dish, wax]);
  const mesh = new THREE.InstancedMesh(geo, MAT.wax.clone(), candleSlots.length);
  mesh.castShadow = false; mesh.receiveShadow = true;
  mesh.name = 'votives';
  const m = new THREE.Matrix4();
  let seated = 0, floated = 0;
  const audit = {};   // per original height, so a failure names WHICH family of slots
  /* A straight-down ray from the slot found a surface for only 36 of the 96, and that was
     the check EARNING its keep rather than failing: the window-ledge slots sit at
     x = +-12.38 while the ledge they are named after spans 12.56 to 13.18, so they were
     never over it. Eighteen centimetres, invisible in code, a candle hanging in space on
     a 12ft projection. So probe outward from the wall as well, take the first surface
     found, and MOVE the slot onto it. Self-correcting: if a ledge is ever rebuilt at a
     different depth the candles follow it instead of quietly detaching again. */
  /* SEARCH FOR THE NAMED SURFACE, and reject anything that is not it.
     The audit is what forced this. A plain downward ray "succeeded" for 38 of the 40 sill
     slots while dropping them to y=0.35, which is the floor at the foot of the wall, not
     the ledge at 1.4 they are named after. A hit is not the same as the right hit. The
     balcony rail slots found nothing at all and the outer door-step slots hang past the
     edge of a step that stops at x=+-5.

     So: probe a neighbourhood, and only accept a surface within a window of the height
     the slot was authored at. Nearest-to-intended wins, which keeps a candle on its own
     ledge instead of teleporting it to the floor two metres below. */
  const cast = (x, y, z) => {
    ray.set(new THREE.Vector3(x, y + 0.6, z), down);
    return ray.intersectObject(hall, true)
      .filter(h => h.object.isMesh && h.object.visible && h.object !== mesh
                   && h.object.material !== MAT.moonGlow);
  };
  candleSlots.forEach((p, i) => {
    const wantLo = p.y - 0.95, wantHi = p.y + 0.15;   // the surface this slot MEANT
    let best = null, sx = p.x, sz = p.z;
    const consider = (x, z) => {
      for (const h of cast(x, p.y, z)) {
        if (h.point.y < wantLo || h.point.y > wantHi) continue;
        if (!best || Math.abs(h.point.y - p.y) < Math.abs(best.point.y - p.y)) {
          best = h; sx = x; sz = z;
        }
        break;                                       // topmost qualifying surface only
      }
    };
    const out = Math.sign(p.x) || 1;                 // outward is toward the nearer wall
    consider(p.x, p.z);
    for (const d of [0.25, 0.5, 0.75, 1.0, -0.25, -0.5, -0.75, -1.0]) { if (best) break; consider(p.x + out * d, p.z); }
    for (const d of [0.35, -0.35, 0.7, -0.7]) { if (best) break; consider(p.x, p.z + d); }
    const hit = best;
    const baseY = hit ? hit.point.y + 0.002 : p.y;
    if (hit) seated++; else floated++;
    const fam = p.y.toFixed(2);
    const A = audit[fam] = audit[fam] || { n: 0, hit: 0, miss: 0, dropTo: null };
    A.n++; hit ? A.hit++ : A.miss++;
    if (hit && A.dropTo === null) A.dropTo = +baseY.toFixed(2);
    p.x = sx; p.z = sz;
    m.makeTranslation(sx, baseY, sz);
    mesh.setMatrixAt(i, m);
    // the flame now sits on the WICK of a real candle instead of in the air
    p.y = baseY + 0.255;
  });
  mesh.instanceMatrix.needsUpdate = true;
  hall.add(mesh);
  console.log('votives: ' + seated + ' seated on geometry, ' + floated + ' found no surface');
  window.__votiveStats = { seated, floated, total: candleSlots.length, families: audit };
  return mesh;
})();

const flameTex = makeFlameTextures();
const flames = new Flames([hall], flameTex);
flames.reduced = REDUCED;

/* chandelier flames ride their swinging fitting */
for (const ch of chandeliers)
  ch.local.forEach((p, k) => flames.add(p, 991 + ch.seed * 31 + k, { size: 0.42, parents: [ch.group] }));
/* candelabra flames: furniture, fully lit from the first frame. No stand ever shows
   one odd candle again. */
ambient.forEach((p, k) => flames.add(p, 1771 + k, { size: 0.36 }));

const waxGeo = new THREE.CylinderGeometry(0.072, 0.082, 0.60, 8);
const wax = [], WAXCAP = candleSlots.length;
{
  const m = new THREE.InstancedMesh(waxGeo, MAT.wax, WAXCAP);
  m.count = 0;
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  hall.add(m);
  wax.push(m);
}

let litCount = 0;
function lightCandle(flare) {
  if (litCount >= candleSlots.length) return false;
  const i = litCount++;
  const p = candleSlots[i];
  const m = new THREE.Matrix4().makeTranslation(p.x, p.y, p.z);
  const at = new THREE.Vector3(p.x, p.y + 0.42, p.z);
  const put = () => {
    for (const w of wax) {
      w.setMatrixAt(i, m);
      w.count = Math.max(w.count, i + 1);
      w.instanceMatrix.needsUpdate = true;
    }
    const f = flames.add(at, i, { size: 0.38 });
    if (flare) f.birth = 1.1;
  };
  // A live arrival travels: the spark leaves the mirror and the candle catches when it
  // lands. Backfill on page load just appears, or a reload would fire two hundred sparks.
  if (flare) sendSpark(at, put); else put();
  return true;
}

/* ---------- THE CHOOSING ----------
   The one hard beat. The room dims, a gilt frame on the wall ignites, and the guest's
   name is engraved into it. Everything else in this piece drifts; this lands. */
/* the leftmost and rightmost columns carrying any ink, in a horizontal band */
function inkExtent(g, y0, h) {
  const d = g.getImageData(0, y0, 1024, h).data;
  let min = 1e9, max = -1;
  for (let y = 0; y < h; y++)
    for (let x = 0; x < 1024; x++)
      if (d[(y * 1024 + x) * 4 + 3] > 24) { if (x < min) min = x; if (x > max) max = x; }
  return max < 0 ? null : { min, max, w: max - min };
}

/* The plaque is PARCHMENT with engraved oxblood type, not white type on a gold fill:
   a filled gold rectangle is the one thing the deck bans, white-on-gold is ~2.4:1
   contrast at venue distance, and additive blending could never show dark ink at all
   (additive can only add light). Kicker in silver, name in oxblood, per the deck's
   two-metal separation. */
function makeNameTexture(handle) {
  const serif = "'Cormorant Garamond','Playfair Display',Georgia,serif";
  /* FIT the name by MEASURING THE INK on a transparent scratch canvas.
     measureText does not reliably account for ctx.letterSpacing, and ink-scanning
     needs transparency, which the parchment fill would destroy. */
  const scratch = document.createElement('canvas');
  scratch.width = 1024; scratch.height = 200;
  const sg = scratch.getContext('2d');
  sg.textAlign = 'center'; sg.textBaseline = 'middle';
  try { sg.letterSpacing = '20px'; } catch {}
  const MAXW = 800;
  let size = 170, ink = null;
  for (let attempt = 0; attempt < 14; attempt++) {
    sg.clearRect(0, 0, 1024, 200);
    sg.fillStyle = '#000';
    sg.font = `600 ${size}px ${serif}`;
    sg.fillText(handle, 512, 100);
    ink = inkExtent(sg, 0, 200);
    if (!ink || ink.w <= MAXW) break;
    size = Math.max(40, Math.round(size * (MAXW / ink.w) * 0.97));
  }
  window.__lastInk = ink;

  const c = document.createElement('canvas');
  c.width = 1024; c.height = 640;
  const g = c.getContext('2d');
  // the parchment card, inset from the canvas edge so the gold frame shows around it
  const card = { x: 56, y: 48, w: 912, h: 544 };
  const pg = g.createLinearGradient(0, card.y, 0, card.y + card.h);
  pg.addColorStop(0, '#F1E8D4');
  pg.addColorStop(0.5, '#EDE4D3');
  pg.addColorStop(1, '#DFD2B6');
  g.fillStyle = pg;
  g.fillRect(card.x, card.y, card.w, card.h);
  // double rule border, engraved
  g.strokeStyle = 'rgba(90,14,27,0.65)';
  g.lineWidth = 4;
  g.strokeRect(card.x + 22, card.y + 22, card.w - 44, card.h - 44);
  g.lineWidth = 1.5;
  g.strokeRect(card.x + 34, card.y + 34, card.w - 68, card.h - 68);

  g.textAlign = 'center'; g.textBaseline = 'middle';
  try { g.letterSpacing = '14px'; } catch {}
  g.fillStyle = 'rgba(96,104,116,0.85)';          // the silver kicker
  g.font = `600 40px ${serif}`;
  g.fillText('THE MIRROR HAS CHOSEN', 512, 175);
  try { g.letterSpacing = '20px'; } catch {}
  g.fillStyle = '#5A0E1B';                        // the name, in oxblood ink
  g.font = `600 ${size}px ${serif}`;
  g.fillText(handle, 512, 340);
  // the emboss: a hairline of light above the ink, so it reads cut, not printed
  g.fillStyle = 'rgba(255,250,235,0.55)';
  g.fillText(handle, 512, 337.5);
  g.fillStyle = '#5A0E1B';
  g.fillText(handle, 512, 340);
  try { g.letterSpacing = '0px'; } catch {}
  g.strokeStyle = 'rgba(90,14,27,0.5)';
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(360, 468); g.lineTo(664, 468); g.stroke();
  // the instruction that gives the beat its NEXT STEP: this is a photo moment
  try { g.letterSpacing = '10px'; } catch {}
  g.fillStyle = 'rgba(96,104,116,0.8)';
  g.font = `600 30px ${serif}`;
  g.fillText('STEP TO THE MIRROR', 512, 520);
  try { g.letterSpacing = '0px'; } catch {}

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---------- THE TAKEN BEAT ----------
   The mirror does not only choose, it TAKES. The room inhales: every candle gutters
   down toward dark, the moon goes cold and hard, one gilt frame keeps the taken
   guest's name, and then the room breathes back. Deliberately the opposite shape to
   the choosing, which blooms warm; this one drains. */
let takenMix = 0;
const takenPlate = (() => {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(6.9, 4.3),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  m.position.set(0, 0, 0.07);
  herald.group.add(m);
  return m;
})();
function makeTakenTexture(handle) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 640;
  const g = c.getContext('2d');
  const serif = "'Cormorant Garamond','Playfair Display',Georgia,serif";
  // cold parchment: the same card stock as the choosing, drained of its warmth
  const pg = g.createLinearGradient(0, 48, 0, 592);
  pg.addColorStop(0, '#D9DCE4'); pg.addColorStop(1, '#AEB4C2');
  g.fillStyle = pg; g.fillRect(56, 48, 912, 544);
  g.strokeStyle = 'rgba(40,44,58,0.55)'; g.lineWidth = 4;
  g.strokeRect(78, 70, 868, 500);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  try { g.letterSpacing = '14px'; } catch {}
  g.fillStyle = 'rgba(58,62,78,0.85)';
  g.font = `600 40px ${serif}`;
  g.fillText('THE MIRROR HAS TAKEN', 512, 175);
  try { g.letterSpacing = '20px'; } catch {}
  g.fillStyle = '#2A2E3C';
  let size = 170;
  g.font = `600 ${size}px ${serif}`;
  while (g.measureText(handle).width > 780 && size > 44) {
    size -= 6; g.font = `600 ${size}px ${serif}`;
  }
  g.fillText(handle, 512, 340);
  try { g.letterSpacing = '10px'; } catch {}
  g.fillStyle = 'rgba(58,62,78,0.8)';
  g.font = `600 30px ${serif}`;
  g.fillText('THE ROOM WILL REMEMBER', 512, 500);
  try { g.letterSpacing = '0px'; } catch {}
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function beginTaken(guestId) {
  const g = S.guests.get(guestId);
  if (takenPlate.material.map) takenPlate.material.map.dispose();
  takenPlate.material.map = makeTakenTexture((g && g.handle) || 'A GUEST');
  takenPlate.material.needsUpdate = true;
  flames.blow(0, 1.6);                 // the draught that starts it
}

/* ---------- THE MIDNIGHT VOTE ----------
   The room asks, the floor answers on their phones, and the hall shows the tally as
   two rivers of candlelight racing along the aisle. No UI chrome: the count IS the
   light, which is the only way a vote reads from across a dark room. */
let voteMix = 0;
const voteBars = [-1, 1].map(side => {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(1.5, 26),
    new THREE.MeshBasicMaterial({
      color: side < 0 ? C.amber : C.moon, map: MAT.shaftFade, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(side * 2.6, 0.09, -12);
  scene.add(m);
  return m;
});
const voteText = (() => {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(19, 4.75),
    new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: 0, depthWrite: false }));
  m.position.set(0, 12.4, FAR_Z + 3.2);
  scene.add(m);
  return { mesh: m, canvas: c, tex: t };
})();
function paintVote(v) {
  const g = voteText.canvas.getContext('2d');
  const serif = "'Cormorant Garamond','Playfair Display',Georgia,serif";
  g.clearRect(0, 0, 1024, 256);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  try { g.letterSpacing = '12px'; } catch {}
  g.fillStyle = '#F2E4C0';
  const q = v.q || 'CANDLELIGHT OR MOONLIGHT';
  let qs = 62;
  g.font = `600 ${qs}px ${serif}`;
  while (g.measureText(q).width > 940 && qs > 22) {
    qs -= 3; g.font = `600 ${qs}px ${serif}`;
  }
  g.fillText(q, 512, 78);
  g.font = `600 44px ${serif}`;
  g.fillStyle = '#FFB661';
  g.fillText(`${v.a || 'CANDLELIGHT'}  ${v.tally ? v.tally.a : 0}`, 300, 178);
  g.fillStyle = '#C7C4E4';
  g.fillText(`${v.b || 'MOONLIGHT'}  ${v.tally ? v.tally.b : 0}`, 724, 178);
