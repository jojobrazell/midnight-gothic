let chooseMix = 0;                    // 0 idle, 1 fully in the beat
let chosenFrame = null;
function beginChoosing(guestId) {
  const g = S.guests.get(guestId);
  // ALWAYS the herald frame on the apse: square to the camera and readable.
  const wf = herald;
  if (!wf) return;
  if (!wf.plate) {
    // normal blending: the plaque carries dark ink, and additive cannot darken.
    // Sized to the herald over the grand door (canvas aspect 1.6).
    wf.plate = new THREE.Mesh(
      new THREE.PlaneGeometry(6.9, 4.3),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    wf.plate.position.set(0, 0, 0.06);
    wf.group.add(wf.plate);
  }
  if (wf.plate.material.map) wf.plate.material.map.dispose();
  wf.plate.material.map = makeNameTexture((g && g.handle) || 'A GUEST');
  wf.plate.material.needsUpdate = true;
  chosenFrame = wf;
  flames.blow(0, 1.3);               // the room feels it
}

/* ---------- ARRIVAL ----------
   A guest joining used to make a candle silently exist, which is why nothing on screen
   said anything was happening. Now a spark leaves the mirror, arcs across the room, and
   lights their candle: the room visibly reacts to a person on the door. */
const sparks = [];
const ringGeo = new THREE.TorusGeometry(1, 0.045, 6, 40);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0xFFDCA0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });

function sendSpark(target, onArrive) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: flameTex.glow, color: 0xFFF0C8, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(s);
  sparks.push({
    s, t: 0, dur: 1.05 + Math.abs(target.x) * 0.02,
    // born at the herald over the grand door: the mirror grants the candle
    from: new THREE.Vector3(0, 9.2, FAR_Z + 2),
    ctrl: new THREE.Vector3(target.x * 0.35, 14.5, (FAR_Z + 2 + target.z) / 2),
    to: target.clone(), onArrive,
  });
}

/* POOLED arrival lights (research panel finding): adding or removing a PointLight
   changes NUM_POINT_LIGHTS, which recompiles EVERY material in the scene: a
   multi-hundred-ms hitch on each guest join. Three pre-allocated slots, moved and
   dimmed, never added or removed. */
const rings = [];
const ringLights = Array.from({ length: 3 }, () => {
  const l = new THREE.PointLight(0xFFD79A, 0, 18, 2);
  scene.add(l);
  return l;
});
let ringLightIdx = 0;
function popRing(pos) {
  const m = new THREE.Mesh(ringGeo, ringMat.clone());
  m.position.copy(pos);
  m.rotation.x = -Math.PI / 2;
  scene.add(m);
  const light = ringLights[ringLightIdx++ % ringLights.length];
  light.position.copy(pos);
  light.intensity = 55;
  rings.push({ m, t: 0, light });
}

function updateArrivals(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const k = sparks[i];
    k.t += dt / k.dur;
    if (k.t >= 1) {
      scene.remove(k.s); k.s.material.dispose();
      sparks.splice(i, 1);
      popRing(k.to);
      k.onArrive && k.onArrive();
      continue;
    }
    const u = k.t, iu = 1 - u;
    k.s.position.set(
      iu * iu * k.from.x + 2 * iu * u * k.ctrl.x + u * u * k.to.x,
      iu * iu * k.from.y + 2 * iu * u * k.ctrl.y + u * u * k.to.y,
      iu * iu * k.from.z + 2 * iu * u * k.ctrl.z + u * u * k.to.z);
    const sc = 0.5 + Math.sin(u * Math.PI) * 0.75;
    k.s.scale.set(sc, sc, 1);
    k.s.material.opacity = Math.min(1, (1 - u) * 3.2);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.t += dt / 0.85;
    if (r.t >= 1) {
      scene.remove(r.m); r.m.material.dispose();
      r.light.intensity = 0;              // pooled: dimmed, never removed
      rings.splice(i, 1);
      continue;
    }
    const s = 0.15 + r.t * 2.4;
    r.m.scale.set(s, s, s);
    r.m.material.opacity = (1 - r.t) * 0.8;
    r.light.intensity = 55 * (1 - r.t) * (1 - r.t);
  }
}

/* ---------- ambient magic ----------
   Slowsie asked for gothic MAGICAL. This is where that lives: motes rising through the
   candlelight, and a sigil turning slowly on the floor. Both are additive and cheap. */
const moteCount = REDUCED ? 120 : LITE ? 200 : 520;
const motes = (() => {
  const pos = new Float32Array(moteCount * 3);
  const spd = new Float32Array(moteCount);
  for (let i = 0; i < moteCount; i++) {
    pos[i * 3] = (Math.sin(i * 12.9898) * 43758.5453 % 1) * 24 - 12;
    pos[i * 3 + 1] = ((i * 0.6180339887) % 1) * 17;
    pos[i * 3 + 2] = Z0 - ((i * 0.7548776662) % 1) * 50;
    spd[i] = 0.20 + ((i * 0.3819660113) % 1) * 0.55;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.Points(g, new THREE.PointsMaterial({
    map: flameTex.glow, color: 0xFFC98A, size: 0.34, sizeAttenuation: true,
    transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(m);
  return { points: m, pos, spd };
})();

/* the moon dust rides in the same system now: the formal room breathes evenly */

/* rose petals, falling slowly through the room. The board's romance, in motion.
   Normal blending on purpose: an additive petal glows white and reads as an ember. */
const petalTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(30, 26, 4, 32, 32, 30);
  rg.addColorStop(0, 'rgba(248,206,216,0.95)');
  rg.addColorStop(0.6, 'rgba(233,169,184,0.9)');
  rg.addColorStop(1, 'rgba(190,110,132,0)');
  g.fillStyle = rg;
  g.beginPath();
  g.ellipse(32, 32, 26, 17, 0.5, 0, Math.PI * 2);
  g.fill();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const PETALS = REDUCED ? 8 : LITE ? 12 : 26;
const petals = [];
const petalSpawn = () => ({
  x: -9 + Math.random() * 18, z: 12 - Math.random() * 48,
  y: 10 + Math.random() * 5,
  spd: 0.35 + Math.random() * 0.4, ph: Math.random() * 6.28,
  spin: (Math.random() - 0.5) * 1.6,
});
for (let i = 0; i < PETALS; i++) {
  // tinted DOWN: a petal is a dark silhouette with a rose rim, not pink confetti
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: petalTex, color: 0x9A5A68, transparent: true, opacity: 0, depthWrite: false }));
  s.scale.set(0.28, 0.24, 1);
  scene.add(s);
  const p = petalSpawn();
  p.y = Math.random() * 12;          // first generation scattered mid-fall
  petals.push({ s, ...p });
}

/* the spinning floor sigil is GONE (JoJo: "what is that symbol spinning on the ground?").
   Magic now lives in the flames, the dust and the petals, not in occult set dressing. */


/* the warm flash that ignites the herald during the choosing. Without it the gold
   frame sits in the apse's cool moonlight and the beat has no temperature change. */
const heraldLight = new THREE.PointLight(C.amber, 0, 28, 2);
heraldLight.position.set(0, 8.6, (herald ? herald.group.position.z : FAR_Z + 1.35) + 2.5);
scene.add(heraldLight);

/* the vignette frame is GONE (JoJo, twice: "not a fan of the mirror", "looks like a
   suitcase"). The projection is a window into the hall, edge to edge. */
scene.add(camera);

/* ---------- THE STEP-AND-REPEAT ----------
   JoJo's call, 2026-08-13: the wall doubles as an interactive photo backdrop. A velvet
   drape bearing the sponsor lattice descends over the apse when staff drop it, the
   camera squares up, and people shoot in front of it while the candles and petals keep
   moving. The mirror choosing someone is the same thing personalised: their NAME
   becomes the backdrop. PLACEHOLDER ART: MIXR STUDIOS + ENDLESS RIVER wordmarks set in
   type; real vector marks and written sign-off required before the night (EA rule),
   and sponsor rows get added to this texture when Slowsie names them. */
const stepWall = (() => {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 576;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, 576);
  bg.addColorStop(0, '#2E1838');
  bg.addColorStop(1, '#1C0F26');
  g.fillStyle = bg;
  g.fillRect(0, 0, 1024, 576);
  // velvet fold shading, vertical
  for (let i = 0; i < 12; i++) {
    const x = (i + 0.5) * (1024 / 12);
    const fg = g.createLinearGradient(x - 42, 0, x + 42, 0);
    fg.addColorStop(0, 'rgba(0,0,0,0.30)');
    fg.addColorStop(0.5, 'rgba(233,169,184,0.05)');
    fg.addColorStop(1, 'rgba(0,0,0,0.30)');
    g.fillStyle = fg;
    g.fillRect(x - 42, 0, 84, 576);
  }
  const serif = "'Cormorant Garamond','Playfair Display',Georgia,serif";
  g.textAlign = 'center'; g.textBaseline = 'middle';
  /* The lattice alternates THE REAL MIXR WORDMARK (recoloured gold from the black
     source PNG) with ENDLESS RIVER in type (their mark is still awaited, EA rule).
     Drawn once with type as placeholder, redrawn the moment the logo image lands. */
  const drawLattice = (logoImg) => {
    const rows = 5, cols = 2;
    for (let r = 0; r < rows; r++) {
      const y = (r + 0.5) * (576 / rows);
      const off = (r % 2) * 0.5;                // the classic diamond offset
      for (let col = 0; col <= cols; col++) {
        const x = ((col + 0.5 - off) / cols) * 1024;
        if (x < 170 || x > 854) {
          if (x > -60 && x < 1084) {
            g.fillStyle = 'rgba(200,162,74,0.45)';
            g.font = `400 26px ${serif}`;
            g.fillText('✦', Math.max(30, Math.min(994, x)), y);
          }
          continue;
        }
        if ((r + col) % 2 === 0 && logoImg) {
          const lw = 240, lh = lw * (logoImg.height / logoImg.width);
          g.drawImage(logoImg, x - lw / 2, y - lh / 2 + 2, lw, lh);
        } else {
          const mark = (r + col) % 2 === 0 ? 'MIXR STUDIOS' : 'ENDLESS RIVER';
          try { g.letterSpacing = '6px'; } catch {}
          g.font = `600 36px ${serif}`;
          g.fillStyle = 'rgba(20,10,26,0.75)';  // engraved shadow
          g.fillText(mark, x, y + 2);
          g.fillStyle = '#C8A24A';
          g.fillText(mark, x, y);
          try { g.letterSpacing = '0px'; } catch {}
        }
      }
    }
  };
  drawLattice(null);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  // load the mark, recolour it gold with an engraved shadow, redraw the lattice
  const logoSrc = new Image();
  logoSrc.onload = () => {
    const off2 = document.createElement('canvas');
    off2.width = logoSrc.width; off2.height = logoSrc.height;
    const og = off2.getContext('2d');
    og.drawImage(logoSrc, 0, 0);
    og.globalCompositeOperation = 'source-in';
    og.fillStyle = '#C8A24A';
    og.fillRect(0, 0, off2.width, off2.height);
    // rebuild: background + folds first, then the lattice with the gold mark
    const bg2 = g.createLinearGradient(0, 0, 0, 576);
    bg2.addColorStop(0, '#2E1838'); bg2.addColorStop(1, '#1C0F26');
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = bg2; g.fillRect(0, 0, 1024, 576);
    for (let i = 0; i < 12; i++) {
      const x = (i + 0.5) * (1024 / 12);
      const fg = g.createLinearGradient(x - 42, 0, x + 42, 0);
      fg.addColorStop(0, 'rgba(0,0,0,0.30)');
      fg.addColorStop(0.5, 'rgba(233,169,184,0.05)');
      fg.addColorStop(1, 'rgba(0,0,0,0.30)');
      g.fillStyle = fg;
      g.fillRect(x - 42, 0, 84, 576);
    }
    drawLattice(off2);
    t.needsUpdate = true;
  };
  logoSrc.src = 'textures/brand/compressed/mixr_logo.webp';
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(21, 11.8),
    new THREE.MeshBasicMaterial({ map: t, toneMapped: true }));
  mesh.position.set(0, 26, -36);                // parked above the ceiling, out of sight
  mesh.visible = false;
  scene.add(mesh);
  return mesh;
})();
let photoMix = 0;

/* ---------- post ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

/* GTAO: screen-space ambient occlusion with Poisson denoise. Contact darkening in
   every corner, junction and under-balcony shadow, which is most of the difference
   between "3D model" and "room". */
/* half resolution: the Poisson denoiser hides the undersampling, the cost quarters */
const gtao = new GTAOPass(scene, camera, innerWidth >> 1, innerHeight >> 1);
gtao.setSceneClipBox(new THREE.Box3(
  new THREE.Vector3(-14.5, -1, -42), new THREE.Vector3(14.5, 17, 16)));
gtao.updateGtaoMaterial({
  radius: 0.9, distanceExponent: 1.6, thickness: 1.2,
  scale: 1.4, samples: 12, distanceFallOff: 1.0, screenSpaceRadius: false,
});
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2.5, normalPhi: 3.5, radius: 6, rings: 3, samples: 12 });
gtao.blendIntensity = 0.9;
/* GTAOPass hides Points and Lines during its G-buffer render but NOT Sprites, and
   Sprites ignore scene.overrideMaterial, so every flame glow rendered its own additive
   material INTO the normal buffer: the denoiser turned each one into a hard black
   card. Patch the instance to also hide sprites and additive-blended meshes (the
   moonbeam shells) during that pass; _restoreVisibility restores from the same cache. */
gtao._overrideVisibility = function () {
  const cache = this._visibilityCache;
  this.scene.traverse(o => {
    const additiveMesh = o.isMesh && o.material && o.material.transparent &&
      o.material.blending === THREE.AdditiveBlending;
    if ((o.isPoints || o.isLine || o.isSprite || additiveMesh) && o.visible) {
      o.visible = false;
      cache.push(o);
    }
  });
};
gtao.enabled = !NOAO && !LITE;
composer.addPass(gtao);

// Tighter bloom: fat equal halos on every candle erase distance (near and far flames
// bloomed the same) and eat the geometry around them. Smaller radius, higher floor.
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.52, 0.48, 0.9);
/* CHROMATIC HALATION (research panel): the bloom mips are individually tintable and
   almost nobody uses it. Tight core mips stay amber, the room-scale halo mips go
   lilac: candle physics meeting the midnight palette, at zero cost. */
bloom.bloomTintColors[0].set(1.00, 0.86, 0.62);
bloom.bloomTintColors[1].set(1.00, 0.80, 0.55);
bloom.bloomTintColors[2].set(0.95, 0.78, 0.72);
bloom.bloomTintColors[3].set(0.80, 0.72, 1.00);
bloom.bloomTintColors[4].set(0.70, 0.64, 1.00);
bloom.compositeMaterial.uniforms['bloomFactors'].value = [1.0, 0.9, 0.8, 0.7, 0.6];
composer.addPass(bloom);
composer.addPass(new OutputPass());
const smaa = new SMAAPass();
/* the default 0.1 edge threshold is an absolute RGB delta, so in a room that is 80
   percent near-black it finds almost no edges: a dark banister against a dark wall
   never trips it. Lower it and the geometry actually antialiases. */
if (smaa._edgesMaterial) {
  smaa._edgesMaterial.defines.SMAA_THRESHOLD = '0.035';
  smaa._edgesMaterial.needsUpdate = true;
}
composer.addPass(smaa);

/* the grade: a soft vignette and living film grain, applied after tonemapping.
   The last few percent of "shot on a camera" instead of "rendered in a browser". */
/* DEPTH OF FIELD, reusing GTAO's depth buffer (no second scene render, no BokehPass
   sprite trap). JoJo's diagnosis, 2026-08-13: "the edges don't really blend in with
   the environment". He was right and it was not a shading choice: EVERY edge in the
   frame was pin sharp at every distance, which no camera and no eye ever produces, so
   objects read as cut out and pasted rather than sitting in air. Near field stays
   sharp, the far end softens. Far-field-only is deliberate: it is ~90 percent of the
   read for a fraction of the cost, and it can never blur the thing being looked at. */
const gradePass = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null }, uTime: { value: 0 },
    tDepth: { value: null }, uNear: { value: camera.near }, uFar: { value: camera.far },
    uFocus: { value: 36 }, uBlur: { value: 1.5 }, uTexel: { value: new THREE.Vector2() },
    // dial it live with ?purple=0.55 rather than re-editing a shader on the venue laptop
    uPurple: { value: +(qs.get('purple') || 0.38) },
  },
  vertexShader: `varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    uniform sampler2D tDepth; uniform float uNear; uniform float uFar;
    uniform float uFocus; uniform float uBlur; uniform vec2 uTexel; uniform float uPurple;
    float viewZ(vec2 uv) {
      float d = texture2D(tDepth, uv).x;
      // perspective depth is nonlinear; without this the blur ramps in the wrong place
      return (2.0 * uNear * uFar) / (uFar + uNear - (d * 2.0 - 1.0) * (uFar - uNear));
    }
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7)) + uTime * 61.0) * 43758.5453); }
    // Jimenez interleaved gradient noise: the +/-0.5 LSB dither that stops a dim
    // projector showing contour rings across every wall falloff
    float ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      /* far-field circle of confusion: 0 at the focus plane, ramping to full past it */
      float z = viewZ(vUv);
      float coc = clamp((z - uFocus) / 34.0, 0.0, 1.0);
      coc = coc * coc * uBlur;
      if (coc > 0.004) {
        // 8 taps on two rings, offset so the kernel never reads as a cross
        vec3 sum = c.rgb;
        float r = coc * 3.4;
        for (int i = 0; i < 8; i++) {
          float a = float(i) * 0.7853981634 + 0.3926990817;
          vec2 o = vec2(cos(a), sin(a)) * uTexel * r * (i < 4 ? 1.0 : 2.1);
          sum += texture2D(tDiffuse, vUv + o).rgb;
        }
        c.rgb = mix(c.rgb, sum / 9.0, min(1.0, coc * 1.6));
      }
      vec2 q = vUv - 0.5;
      float r2 = dot(q, q);
      // a LENS vignette, not a CSS gradient: corners also desaturate and cool
      float vig = clamp(1.0 - 0.42 * r2 * 4.0, 0.0, 1.0);
      c.rgb *= mix(0.62, 1.0, vig);
      float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
      c.rgb = mix(c.rgb, mix(vec3(l), c.rgb, 0.85) * vec3(0.94, 0.94, 1.06), (1.0 - vig) * 0.6);
      /* MIDNIGHT PURPLE, as a SPLIT TONE rather than more coloured lights (JoJo: "add
         some more midnight purple to this scene"). Tinting by adding purple lamps would
         have washed the candle amber toward magenta and flattened the contrast the bake
         works for. A split tone pushes only the DARKS toward violet and leaves anything
         a flame is actually lighting alone, which is how a night grade is built: the
         shadows carry the colour, the practicals stay warm.
         Re-tint at constant luma so pushing the hue never darkens the room. */
      float lum2 = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
      float sw = 1.0 - clamp(lum2 * 1.7, 0.0, 1.0);
      sw *= sw;
      /* PROTECT WHAT A FLAME IS LIGHTING. Luma alone is not enough: the bronze of the
         chandelier and the wax of a candle sit in the midtones, so a pure luma mask
         dragged the one warm hero element in the room toward violet and the fitting went
         dead. Anything already warmer in red than blue keeps its amber. */
      sw *= 1.0 - clamp((c.r - c.b) * 2.6, 0.0, 1.0);
      vec3 violet = vec3(lum2) * vec3(0.74, 0.47, 1.32);
      c.rgb = mix(c.rgb, violet, sw * uPurple);
      // monochrome luma-weighted grain: film emulsion, not sensor noise
      float g = hash(gl_FragCoord.xy / 1.25 + vec2(uTime * 37.0)) - 0.5;
      c.rgb += g * 0.026 * mix(1.0, 0.25, l);
      // dither dead last
      c.rgb += (1.0 / 255.0) * ign(gl_FragCoord.xy) - (0.5 / 255.0);
      gl_FragColor = c;
    }`,
});
composer.addPass(gradePass);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  if (PORTAL) applyPortal();                 // updateProjectionMatrix would overwrite
  else camera.updateProjectionMatrix();      // the off-axis portal frustum
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
  gtao.setSize(innerWidth >> 1, innerHeight >> 1);
});

/* The herald is INVISIBLE until the mirror chooses: an empty gold frame hanging over
   the door all night read as a switched-off TV covering the door (JoJo, three rounds
   running, finally heard properly). The frontispiece and door stand clean; the frame
   and plaque MATERIALISE for the beat and dissolve after. */
herald.group.visible = false;

/* ---------- THE LIGHT BAKE ----------
   The overhaul centrepiece. Every candle's contribution, including the shadowing and
   the corner occlusion no realtime light gives us, is solved once into vertex data and
   read back for free every frame after. This is what an offline renderer's bounced
   light buys, without giving up a single frame of interactivity: the room stays fully
   live, which is the whole reason we are still in three.js (guests will control it).
   ?nobake=1 skips it if the venue machine ever struggles. */
const bakeLights = [];
for (const p of candleSlots) bakeLights.push({ position: p, color: C.amber, intensity: 2.2, range: 7 });
for (const p of ambient)     bakeLights.push({ position: p, color: C.amber, intensity: 3.0, range: 8 });
for (const p of standLights) bakeLights.push({ position: p, color: C.amber, intensity: 6.0, range: 9 });
for (const k of keyLights)
  bakeLights.push({ position: k.light.getWorldPosition(new THREE.Vector3()),
                    color: C.amber, intensity: k.power, range: 70, group: 2 });
bakeLights.push({ position: new THREE.Vector3(0, 6.5, FAR_Z + 6),
                  color: C.amber, intensity: 26, range: 40, group: 1 });



let bakeStats = null;
if (qs.get('nobake') !== '1' && !LITE) {
  const job = bakeIrradiance([hall, floor, rug], {
    lights: bakeLights,
    // the window panes are GLASS: they must not shadow the room they light
    isOccluder: m => m.material !== MAT.moonGlow,
    onDone: st => { bakeStats = st; console.log('bake done', st.vertices, 'verts in', st.ms, 'ms'); },
  });
  window.__bake = job;
}

/* ---------- the sensors ---------- */
const field = new MotionField({ cols: 40 });
const audio = new AudioField();

/* ---------- state ---------- */
const S = { guests: new Map(), phase: { name: 'idle', guestId: 0 }, mood: 'candle', photoMode: false, vote: null };
let clock = 0;

/* ---------- frame ---------- */
function frame(dt) {
  clock += dt;
  field.update(dt);
  audio.update(dt);
  const aB = audio.live ? audio.bass : 0;
  const aM = audio.live ? audio.mid : 0;
  const aT = audio.live ? audio.treble : 0;
  const aBeat = audio.live ? audio.beat : 0;
  flames.boost = 1 + aBeat * 0.35;               // every flame jumps on the kick

  // a big movement in the room sends one gust across the hall
  if (field.live && field.total > 0.55) {
    let mx = 0, mi = 0;
    for (let c = 0; c < field.cols; c++) if (field.energy[c] > mx) { mx = field.energy[c]; mi = c; }
    let u = mi / (field.cols - 1);
    if (field.flip) u = 1 - u;
    flames.blow(u * 2 - 1, Math.min(1, (field.total - 0.55) * 2.2));
  }

  flames.update(dt, clock, camera, field);
  updateArrivals(dt);

  const amp = REDUCED ? 0.25 : 1;

  /* the chandeliers are PENDULUMS on a chain: slow, heavy, underdamped, and pushed by
     the same gust that moves the flames */
  for (const ch of chandeliers) {
    let fx = amp * (0.085 * Math.sin(clock * 0.47 + ch.seed) + 0.045 * Math.sin(clock * 0.83 + ch.seed * 2.1));
    let fz = amp * (0.070 * Math.sin(clock * 0.39 + ch.seed * 1.6));
    if (field.live) fx += field.total * 0.16 * Math.sin(clock * 0.9 + ch.seed);
    // the bass swings the fittings, each on its own phase so they never sync up
    fx += aB * 0.45 * Math.sin(clock * 1.3 + ch.seed) * amp;
    if (flames.gust > 0.01) fx += flames.gust * 0.55 * (flames.gustX < 0 ? 1 : -1);
    ch.vel.x += (fx - 2.6 * ch.ang.x - 0.85 * ch.vel.x) * dt;
    ch.vel.y += (fz - 2.6 * ch.ang.y - 0.85 * ch.vel.y) * dt;
    ch.ang.x += ch.vel.x * dt;
    ch.ang.y += ch.vel.y * dt;
    ch.group.rotation.z = ch.ang.x;
    ch.group.rotation.x = ch.ang.y;
    // the reflection swings the opposite way for free: its parent has scale.y = -1
    if (ch.mirror) { ch.mirror.rotation.z = ch.ang.x; ch.mirror.rotation.x = ch.ang.y; }
  }

  /* motes rising through the candlelight */
  const mp = motes.pos;
  const moteK = 1 + aM * 1.4;                    // the dust dances in the mids
  for (let i = 0; i < moteCount; i++) {
    mp[i * 3 + 1] += motes.spd[i] * dt * amp * moteK;
    mp[i * 3] += Math.sin(clock * 0.3 + i) * dt * 0.14 * amp;
    if (mp[i * 3 + 1] > 17.4) mp[i * 3 + 1] = 0.25;
  }
  motes.points.geometry.attributes.position.needsUpdate = true;

  // petals: fall, sway, spin, fade in near the top and out near the floor
  for (const p of petals) {
    p.y -= p.spd * dt * amp;
    p.x += Math.sin(clock * 0.7 + p.ph) * dt * 0.35 * amp;
    p.s.material.rotation += dt * p.spin * amp;
    if (p.y < 0.15) Object.assign(p, petalSpawn());
    p.s.position.set(p.x, p.y, p.z);
    p.s.material.opacity = Math.max(0, Math.min(0.62, (12 - p.y) * 0.4, (p.y - 0.1) * 1.6));
  }

  // the moonbeams and their floor pools breathe, slowly and out of step
  beams.forEach((b, i) => {
    const k = b.userData.k || 1;
    b.material.opacity = (0.011 + 0.005 * Math.sin(clock * 0.37 + i * 2.2) + aT * 0.012) * k;
  });

  /* THE VOTE: two rivers of light down the aisle, their lengths racing the tally.
     No UI chrome anywhere: from across a dark room the COUNT has to be the LIGHT. */
  const wantVote = (S.vote && S.vote.open) ? 1 : 0;
  voteMix += (wantVote - voteMix) * Math.min(1, dt * 1.4);
  if (voteMix > 0.01 && S.vote) {
    const ta = S.vote.tally ? S.vote.tally.a : 0;
    const tb = S.vote.tally ? S.vote.tally.b : 0;
    const total = Math.max(1, ta + tb);
    voteBars.forEach((bar, i) => {
      const share = (i === 0 ? ta : tb) / total;
      const len = 4 + share * 30;
      bar.scale.set(1, len / 26, 1);
      bar.position.z = -12 + (26 - len) / 2;
      bar.material.opacity = voteMix * (0.10 + share * 0.30 + aBeat * 0.06);
    });
    voteText.mesh.material.opacity = voteMix;
  } else {
    voteBars.forEach(b => { b.material.opacity = 0; });
    voteText.mesh.material.opacity = 0;
  }

  heraldLight.intensity = chooseMix * 70 + takenMix * 18;

  /* THE CHOOSING: the room recedes and the herald MATERIALISES over the door */
  const want = S.phase.name === 'choosing' ? 1 : 0;
  chooseMix += (want - chooseMix) * Math.min(1, dt * (want ? 2.4 : 1.1));
  const ce = chooseMix * chooseMix * (3 - 2 * chooseMix);
  herald.group.visible = chooseMix > 0.02 || takenMix > 0.02;
  herald.group.scale.setScalar(0.82 + 0.18 * ce);      // pours in, not pops
  if (chosenFrame) {
    // The inset SMOULDERS behind the plaque; the parchment is the bright thing.
    chosenFrame.inset.material.emissiveIntensity = chooseMix * 0.3;
    if (chosenFrame.plate) chosenFrame.plate.material.opacity = Math.max(0, chooseMix * 1.5 - 0.5);
  }

  /* THE TAKEN BEAT: the room drains instead of blooming. */
  const wantTaken = S.phase.name === 'taken' ? 1 : 0;
  takenMix += (wantTaken - takenMix) * Math.min(1, dt * (wantTaken ? 2.0 : 0.9));
  if (takenMix > 0.02) {
    herald.group.visible = true;
    takenPlate.material.opacity = Math.max(0, takenMix * 1.5 - 0.5);
    // the flames gutter DOWN and the moon goes hard and cold
    flames.boost = (flames.boost || 1) * (1 - takenMix * 0.55);
    MAT.moonGlow.emissiveIntensity = 0.9 + takenMix * 1.1;
  } else {
    takenPlate.material.opacity = 0;
  }

  const dim = 1 - chooseMix * 0.62 - takenMix * 0.55;
  for (let i = 0; i < keyLights.length; i++) {
    const k = keyLights[i];
    const flick = 1 + amp * 0.06 * Math.sin(clock * 6.3 + i * 2.1)
                    + (field.live ? field.total * 0.12 : 0)
                    + aB * 0.28;
    k.light.intensity = k.power * dim * flick;
    /* the fitting's own lamps flicker WITH its light, so the glow and the illumination
       are never out of step, which is the tell that a glow is a painted-on sprite */
    const lamps = chandeliers[i] && chandeliers[i].lamps;
    if (lamps) for (const m of lamps) m.emissiveIntensity = 5.0 * dim * flick;
    const glass = chandeliers[i] && chandeliers[i].glass;
    if (glass) for (const m of glass) m.emissiveIntensity = 0.85 * dim * flick;
  }
  // the moon answers the music too: panes breathe with the kick, softly
  MAT.moonGlow.emissiveIntensity = 0.85 + aBeat * 0.5;

  /* the baked light BREATHES. Three clusters by height (furniture, rails, chandeliers)
     on their own slow rhythms plus the music, so a frozen solve never reads frozen.
     Zero is neutral in this API, so this is a wobble around the bake, not a scale. */
  setFlicker(
    0.10 * Math.sin(clock * 1.7) + 0.05 * Math.sin(clock * 4.3) + aB * 0.20,
    0.08 * Math.sin(clock * 1.1 + 2.0) + 0.04 * Math.sin(clock * 3.7),
    0.09 * Math.sin(clock * 0.9 + 4.0) + aBeat * 0.15);

  /* the drape: slides down over the apse for photo runs, room brightens to meet it */
  photoMix += ((S.photoMode ? 1 : 0) - photoMix) * Math.min(1, dt * 1.5);
  stepWall.visible = photoMix > 0.01;
  stepWall.position.y = 26 - photoMix * 19.6;    // settles at y 6.4, over the frontispiece

  /* THE CAMERA IS STRAIGHT AND IT STAYS PUT (JoJo, 2026-08-13: "shouldn't the room be
     straight not at an angle?" and, on the choosing push-in, "maybe we scrap that
     portion"). The formal one-point view down the axis to the grand door, like the
     reference. It breathes a few centimetres so the image is alive, and that is all
     the movement it ever makes: the choosing and the photo wall are LIGHTING events
     in a steady room, not camera events. */
  const drift = REDUCED ? 0 : 1;
  // eye height dropped toward the reference's elevated-landing view: at 5.9 it read
  // as a drone shot, at 4.7 the room towers the way a great hall should
  if (PORTAL) {
    /* The portal camera NEVER moves and never tilts: the illusion that the hall
       continues the venue depends on a fixed eye and vertical verticals. All life
       comes from the room itself: flames, shadows, motes, petals, the beats. */
    camera.position.set(0, EYE_H, WINZ + EYE_D);
    camera.rotation.set(0, 0, 0);
  } else {
    // brought IN again (JoJo): z 13 puts the sponsor boards and the door at real size
    camera.position.set(
      Math.sin(clock * 0.05) * 0.12 * drift,
      4.6 + Math.sin(clock * 0.062) * 0.14 * drift,
      2 - Math.sin(clock * 0.043) * 0.4 * drift);
    /* Look slightly UP, not down. The previous frame tilted DOWN to push the near
       chandelier off the top edge, which just traded that problem for a floor-heavy
       one (JoJo: "too much floor"). The chandeliers are now raised in GEOMETRY, so
       the view can sit level-to-rising and both stay solved: the near fitting lands
       about 24 degrees off axis against a 20 degree half-angle, outside the frustum
       with real margin. */
    camera.lookAt(0, 5.6, FAR_Z);
  }

  // the 2Hz shadow tick that replaces per-frame shadow rendering
  frame._shadowT = (frame._shadowT || 0) + dt;
  if (frame._shadowT > 0.5) { frame._shadowT = 0; renderer.shadowMap.needsUpdate = true; }

  gradePass.uniforms.uTime.value = clock % 10;
  // GTAO already renders the depth we need, so DoF costs no extra scene pass
  if (!gradePass.uniforms.tDepth.value && gtao.depthTexture)
    gradePass.uniforms.tDepth.value = gtao.depthTexture;
  gradePass.uniforms.uTexel.value.set(1 / innerWidth, 1 / innerHeight);
  composer.render();
  if (DEV) paintDev();
}

let last = performance.now(), lastDrawn = last, fps = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  fps = fps * 0.92 + (1 / Math.max(dt, 1e-3)) * 0.08;
  last = now; lastDrawn = now;
  frame(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
/* rAF is suspended when this pane is hidden or the venue machine is alt-tabbed, and one
   alt-tab must not freeze the projection while guests keep joining. */
setInterval(() => {
  const now = performance.now();
  if (now - lastDrawn > 900) { last = now; lastDrawn = now; frame(0.2); }
}, 400);
addEventListener('visibilitychange', () => { last = performance.now(); });

/* ---------- load-in readout ---------- */
const devEl = document.getElementById('dev');
const devText = document.getElementById('devtext');
const bars = document.getElementById('bars');
const bctx = bars.getContext('2d');
if (DEV) devEl.classList.add('on');
function paintDev() {
  devText.textContent =
    `fps ${fps.toFixed(0)}  lit ${litCount}/${candleSlots.length}  flames ${flames.list.length}\n` +
    `camera ${field.live ? 'LIVE' : (field.error || 'off')}  motion ${(field.total * 100).toFixed(0)}%`;
  bctx.clearRect(0, 0, bars.width, bars.height);
  const bw = bars.width / field.cols;
  for (let c = 0; c < field.cols; c++) {
    const v = field.energy[c];
    bctx.fillStyle = `rgba(231,201,120,${0.25 + v * 0.75})`;
    bctx.fillRect(c * bw, bars.height * (1 - v), bw - 1, bars.height * v + 1);
  }
}

/* ---------- headless hooks ----------
   The Browser pane will not composite a hidden tab, so verification drives frames by
   hand and POSTs the composite to the server's frame sink. */
window.__step = (dt = 1 / 60, n = 1) => { for (let i = 0; i < n; i++) frame(dt); };
/* MEASURING, not eyeballing. Every geometry defect on this build (the buried herald,
   the floating sill, the clipped banners) was found by putting a number on a bounding
   box, and missed for rounds by looking at it. `__measure('sofa')` gives world extents. */
window.__scene = scene;
window.__camera = camera;
window.__T = THREE;
window.__candleSlots = candleSlots;   // to audit how many guests light a candle anyone sees   // verification scripts need Box3/Vector3 from the SAME module instance
/* SCREEN-SPACE bounds of anything named, in pixels, plus how far it runs off each edge.
   World units cannot answer "is it cropped": that depends on the camera, the fov and the
   aspect together. Projecting all eight corners of the world box is the only honest test,
   and it is what settles framing arguments in one number instead of three rounds. */
window.__screen = (needle) => {
  const w = new THREE.Box3();
  let n = 0;
  scene.traverse(o => {
    if (!o.isMesh) return;
    let nm = '', p = o, vis = true;
    while (p) { if (!p.visible) vis = false; if (p.name) nm += p.name + '/'; p = p.parent; }
    if (!vis || (needle && !nm.includes(needle))) return;
    w.expandByObject(o); n++;
  });
  if (!n) return 'nothing named ' + needle;
  const W = renderer.domElement.width, H = renderer.domElement.height;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, behind = 0;
  for (let i = 0; i < 8; i++) {
    const v = new THREE.Vector3(i & 1 ? w.max.x : w.min.x, i & 2 ? w.max.y : w.min.y,
                                i & 4 ? w.max.z : w.min.z);
    const c = v.clone().applyMatrix4(camera.matrixWorldInverse);
    if (c.z > -camera.near) behind++;
    v.project(camera);
    const px = (v.x * 0.5 + 0.5) * W, py = (-v.y * 0.5 + 0.5) * H;
    x0 = Math.min(x0, px); x1 = Math.max(x1, px);
    y0 = Math.min(y0, py); y1 = Math.max(y1, py);
  }
  const r = v => Math.round(v);
  return { meshes: n, viewport: [W, H], behindCamera: behind,
    box: [r(x0), r(y0), r(x1), r(y1)],
    offTop: r(Math.max(0, -y0)), offBottom: r(Math.max(0, y1 - H)),
    offLeft: r(Math.max(0, -x0)), offRight: r(Math.max(0, x1 - W)),
    fullyVisible: x0 >= 0 && y0 >= 0 && x1 <= W && y1 <= H && behind === 0 };
};
/* Where the floor is actually EMPTY, in 4m bands of depth. "The room feels empty" is a
   real observation but an unactionable one until it says WHERE, and a room this long
   hides its bare stretches behind whatever is close to camera. */
window.__occupancy = () => {
  const bands = {};
  scene.traverse(o => {
    if (!o.isMesh || !o.visible) return;
    const b = new THREE.Box3().setFromObject(o);
    if (b.min.y > 4.2 || b.max.y < 0.05) return;          // only things standing on the floor
    if (b.max.x - b.min.x > 18 || b.max.z - b.min.z > 18) return;   // skip the shell and rugs
    if (Math.min(Math.abs(b.min.x), Math.abs(b.max.x)) > 11.4) return;   // skip wall fittings
    const z = (b.min.z + b.max.z) / 2;
    const k = Math.floor(z / 4) * 4;
    (bands[k] = bands[k] || { n: 0, items: [] }).n++;
    let nm = '', p = o; while (p) { if (p.name) { nm = p.name; break; } p = p.parent; }
    if (bands[k].items.length < 6) bands[k].items.push(nm || o.type);
  });
  return Object.keys(bands).map(Number).sort((a, b) => b - a)
    .map(k => ({ z: k + ' to ' + (k + 4), n: bands[k].n, items: [...new Set(bands[k].items)] }));
};
window.__measure = (needle) => {
  const hits = [];
  scene.traverse(o => {
    if (!o.isMesh) return;
    /* Walk the WHOLE ancestor chain, not to the first named node. glTF meshes carry
       their own author names, so stopping at the first hit never reaches the group we
       named, and every query came back empty while the models were plainly on screen. */
    let n = '', p = o, vis = true;
    while (p) { if (!p.visible) vis = false; if (p.name) n += p.name + '/'; p = p.parent; }
    if (!vis) return;
    if (needle && !n.includes(needle)) return;
    hits.push(o);
  });
  if (!hits.length) return 'nothing named ' + needle;
  const b = new THREE.Box3();
  for (const h of hits) b.expandByObject(h);
  const s = new THREE.Vector3(); b.getSize(s);
  return { meshes: hits.length,
    min: b.min.toArray().map(v => +v.toFixed(2)),
    max: b.max.toArray().map(v => +v.toFixed(2)),
    size: s.toArray().map(v => +v.toFixed(2)) };
};
window.__shot = async (name = 'frame') => {
  frame(0);
  const r = await fetch('/__save?name=' + encodeURIComponent(name),
    { method: 'POST', body: renderer.domElement.toDataURL('image/png') });
  return r.text();                       // never return the data URL, it is megabytes
};
/* CLOSE-CROP EVERY NEW ELEMENT. The floating sill and the half-framed windows both
   shipped because they were only ever judged at full-frame, where a 40px defect is
   invisible and on a 12ft projection is the first thing anyone sees. Fractions of the
   frame, so a resolution change does not silently move the crop. */
window.__crop = async (name, fx, fy, fw, fh, zoom = 2) => {
  frame(0);
  const src = renderer.domElement;
  const sx = Math.round(fx * src.width),  sy = Math.round(fy * src.height);
  const sw = Math.round(fw * src.width),  sh = Math.round(fh * src.height);
  const c = document.createElement('canvas');
  c.width = Math.round(sw * zoom); c.height = Math.round(sh * zoom);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;          // show the actual pixels, not a resampled lie
  g.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const r = await fetch('/__save?name=' + encodeURIComponent(name),
    { method: 'POST', body: c.toDataURL('image/png') });
  return r.text();
};
window.__blow = (x = 0, s = 1) => flames.blow(x, s);
window.__field = field;                    // so the sensor path can be driven in a test
window.__arrive = (n = 1) => {             // fake guests walking in, for verification
  for (let i = 0; i < n; i++) arrive({ id: 90000 + seen.size, handle: 'GUEST' }, true);
};
window.__choose = (handle = 'VESPER') => { // drive the beat without the server
  const id = 90500 + seen.size;
  S.guests.set(id, { id, handle });
  S.phase = { name: 'choosing', guestId: id };
  beginChoosing(id);
};
window.__idle = () => { S.phase = { name: 'idle', guestId: 0 }; S.vote = null; };
 window.__taken = (handle = 'LARK') => {
   const id = 91500 + seen.size;
   S.guests.set(id, { id, handle });
   S.phase = { name: 'taken', guestId: id };
   beginTaken(id);
 };
 window.__vote = (a = 34, b = 21) => {
   S.vote = { q: 'CANDLELIGHT OR MOONLIGHT', a: 'CANDLELIGHT', b: 'MOONLIGHT',
              tally: { a, b }, open: true };
   paintVote(S.vote);
 };
window.__photo = on => { S.photoMode = !!on; };
window.__audio = audio;                    // so sound response can be driven in a test
window.__gtao = gtao;                      // so perf can be isolated in a test
window.__grade = gradePass;                // so the depth-of-field can be proven, not assumed
window.__sway = () => chandeliers.map(c => +Math.hypot(c.ang.x, c.ang.y).toFixed(4));
/* Measure the herald ON SCREEN in pixels. Reasoning about world units and field of
   view got the wrong answer twice; projecting the actual corners cannot. */
window.__project = () => {
  const px = (x, y, z) => {
    const v = new THREE.Vector3(x, y, z);
    herald.group.localToWorld(v);
    v.project(camera);
    return [Math.round((v.x * 0.5 + 0.5) * innerWidth), Math.round((-v.y * 0.5 + 0.5) * innerHeight)];
  };
  const i = herald.inset.geometry.parameters;
  const p = herald.plate ? herald.plate.geometry.parameters : null;
  return {
    viewport: [innerWidth, innerHeight],
    insetLeftRight: [px(-i.width / 2, 0, 0)[0], px(i.width / 2, 0, 0)[0]],
    plateLeftRight: p ? [px(-p.width / 2, 0, 0.06)[0], px(p.width / 2, 0, 0.06)[0]] : null,
    // where the drawn glyphs actually land, from the measured text width
    textLeftRight: p ? (() => {
      const half = (window.__lastTextWidth / 1024) * p.width / 2;
      return [px(-half, 0, 0.06)[0], px(half, 0, 0.06)[0]];
    })() : null,
  };
};

window.__herald = () => {                  // measure, do not eyeball
  const g = herald.group, i = herald.inset.geometry.parameters, p = herald.plate;
  return {
    framePos: g.position.toArray().map(v => +v.toFixed(2)),
    insetSize: [i.width, i.height],
    plateSize: p ? [p.geometry.parameters.width, p.geometry.parameters.height] : null,
    textureSize: p && p.material.map ? [p.material.map.image.width, p.material.map.image.height] : null,
    textWidthPx: window.__lastTextWidth ?? null,
  };
};
/* So a gust can be VERIFIED and not assumed, and so the sensor can be aimed at load-in:
   split the lean by which side of the projection each flame is on. */
window.__lean = () => {
  let max = 0, sum = 0, out = 0, L = 0, nL = 0, R = 0, nR = 0;
  for (const f of flames.list) {
    const t = Math.hypot(f.lean.x, f.lean.y);
    max = Math.max(max, t); sum += t;
    if (f.out > 0) out++;
    if (f.ndc < -0.25) { L += t; nL++; } else if (f.ndc > 0.25) { R += t; nR++; }
  }
  const r = n => +n.toFixed(4);
  return {
    max: r(max), mean: r(sum / flames.list.length), blownOut: out,
    left: r(L / Math.max(1, nL)), leftN: nL,
    right: r(R / Math.max(1, nR)), rightN: nR,
  };
};
window.__state = () => ({
  lit: litCount, slots: candleSlots.length, flames: flames.list.length,
  frames: wallFrames.length, camera: field.live ? 'live' : (field.error || 'off'),
  fps: +fps.toFixed(1),
});

/* ---------- guests ---------- */
const seen = new Set();
function arrive(g, flare) {
  if (seen.has(g.id)) return;
  seen.add(g.id); S.guests.set(g.id, g);
  lightCandle(flare);
}

/* STATIC MODE. The night itself runs off server.mjs on the screen machine, but the room
   also gets uploaded to Bluehost file access, which is plain static hosting and cannot run
   Node. Without this the page still renders (the boot fetch is caught) and then sits there
   completely dead: no guests, no candles, no beats, which is a poor thing to send someone
   as a preview. So when the API is not there, the room runs itself. */
let STATIC_MODE = false;
const DEMO_NAMES = ['VESPER', 'SABLE', 'MARLOW', 'CASS', 'INES', 'RAVEN', 'JUNO', 'ODILE',
                    'NIKO', 'SOLENE', 'BRAM', 'ELIO', 'MIRA', 'ZORA', 'AUGUST', 'LUX'];

/* ---------- BACKDROP MODE, THE DEFAULT (JoJo, 2026-08-14) ----------
   He scrapped the "the mirror has chosen" beat. The room is now a BACKDROP: a live,
   candlelit hall that reacts to the music and sits behind the night, with no name
   reveal, no plaque, no vote and no calling anyone out in front of a room.

   The beat code is gated, not deleted, because the geometry and the timing it drives
   are shared with the photo wall and because reversing a delete costs a rebuild. Opt
   back in with ?mirror=1.

   The load-bearing consequence: a backdrop has to look its best on the FIRST frame.
   The old design lit each votive only when a guest joined, so with the beat gone the
   hall would open dark and stay dark, which is the opposite of what a backdrop is for.
   In backdrop mode the candles light themselves, staggered so they catch rather than
   snap on all at once. */
const BACKDROP = qs.get('mirror') !== '1';

async function boot() {
  // ?static=1 forces it so the Bluehost behaviour is testable against the live server
  if (qs.get('static') === '1') { STATIC_MODE = true; return; }
  try {
    const s = await (await fetch('/api/state')).json();
    for (const g of s.guests) arrive(g, false);
    S.phase = BACKDROP ? { name: 'idle', guestId: 0 } : (s.phase || S.phase);
    S.mood = s.mood || 'candle';
    S.photoMode = !!s.photoMode;
    S.vote = BACKDROP ? null : (s.vote || null);
    if (S.vote) paintVote(S.vote);
    showJoinCard();
  } catch { STATIC_MODE = true; }
}

/* The QR card on the wall. Only when a server answered: in static mode there is
   nothing to join, and a QR to a dead door is worse than no QR. */
function showJoinCard() {
  try {
    const url = location.origin + '/phone.html';
    const el = document.getElementById('joinQr');
    if (window.qrcode && el) {
      const q = window.qrcode(0, 'M'); q.addData(url); q.make();
      el.innerHTML = q.createImgTag(8, 2);
      const img = el.querySelector('img');
      if (img) { img.removeAttribute('width'); img.removeAttribute('height');
        img.alt = 'Scan to light a candle'; }
    }
    document.getElementById('joinUrl').textContent = location.host + '/phone.html';
    document.getElementById('join').style.display = 'flex';
  } catch {}
}

/* Guests trickle in rather than appearing at once, and the mirror keeps choosing, so a
   shared link shows the actual activation rhythm instead of a still frame. */
function runStatic() {
  let n = 0;
  const seat = () => {
    if (n >= 26) return;
    arrive({ id: 70000 + n, handle: DEMO_NAMES[n % DEMO_NAMES.length] }, true);
    n++;
    setTimeout(seat, 420 + (n * 137) % 900);
  };
  setTimeout(seat, 900);
  if (BACKDROP) return;              // a backdrop never calls anyone out
  setInterval(() => {
    const ids = [...S.guests.keys()];
    if (!ids.length) return;
    const id = ids[(clock * 7 | 0) % ids.length];
    S.phase = { name: 'choosing', guestId: id };
    beginChoosing(id);
  }, 21000);
}

/* Light the hall for its own sake. Staggered on a curve so the room CATCHES rather than
   switching on: a backdrop that pops fully lit in one frame reads as a slideshow. */
function lightTheHall() {
  let i = 0;
  const n = Math.min(candleSlots.length, 78);
  const tick = () => {
    if (i >= n) return;
    lightCandle(i < 6);              // the first few flare, the rest just catch
    i++;
    setTimeout(tick, 90 + (i * 53) % 210);
  };
  tick();
}

function listen() {
  if (BACKDROP) lightTheHall();
  if (STATIC_MODE) { runStatic(); return; }   // no server, no stream to listen to
  const es = new EventSource('/api/stream');
  es.addEventListener('arrive', e => arrive(JSON.parse(e.data), true));
  es.addEventListener('phase', e => {
    const p = JSON.parse(e.data);
    const was = S.phase.name;
    S.phase = p;
    if (BACKDROP) { S.phase = { name: 'idle', guestId: 0 }; return; }
    if (p.name === 'choosing' && was !== 'choosing') beginChoosing(p.guestId);
    if (p.name === 'taken' && was !== 'taken') beginTaken(p.guestId);
  });
  es.addEventListener('mood', e => { S.mood = JSON.parse(e.data).mood; });
  es.addEventListener('photomode', e => { S.photoMode = JSON.parse(e.data).on; });
  /* ---------- QR LIVE CONTROL ----------
     A guest's phone reaches the room. The wind starts at THEIR candle, which is the
     whole point: the server sends the exact place it stood them, so the effect has an
     origin a person can point at and say "that one is mine". */
  es.addEventListener('control', e => {
    const c = JSON.parse(e.data);
    const ndc = c.place ? c.place.x * 2 - 1 : 0;
    if (c.action === 'gust') {
      // blow() pushes flames AWAY from the origin, so the origin sits BEHIND the
      // guest for the wind to travel in the direction they asked for
      const dir = Math.sign(c.value) || 1;
      flames.blow(ndc - dir * 0.6, Math.min(1, Math.abs(c.value) || 0.6));
    } else if (c.action === 'flare') {
      for (const f of flames.list) f.birth = Math.max(f.birth, 0.55);
      flames.blow(ndc, 0.35);
    } else if (c.action === 'petals') {
      // a burst from above their candle, not a global reshuffle
      let n = 0;
      for (const p of petals) {
        if (n++ >= 10) break;
        Object.assign(p, petalSpawn());
        p.x = (c.place ? (c.place.x - 0.5) * 18 : 0) + (Math.random() - 0.5) * 3;
        p.y = 9 + Math.random() * 4;
      }
    }
  });
  es.addEventListener('vote', e => { if (BACKDROP) return; S.vote = JSON.parse(e.data); paintVote(S.vote); });
  es.addEventListener('tally', e => {
    if (S.vote) { S.vote.tally = JSON.parse(e.data); paintVote(S.vote); }
  });
  es.addEventListener('rebuild', () => location.reload());
}

const SIM = +(qs.get('sim') || 0);
if (SIM) {
  for (let i = 1; i <= SIM; i++) arrive({ id: i, handle: 'GUEST' + i }, false);
} else {
  boot().then(listen);
}

/* Dismiss the loading screen once the room is actually up. Ready = models placed (LITE
   skips the bake, so that is the true first-visible signal), with a hard cap so a slow
   phone never gets stuck staring at the splash. Two rAFs so the first real frame has
   painted under the overlay before it fades, no flash of black. */
// (loading-screen dismiss is defined near the top of the module, before the top-level
//  await that loads the models, so it exists when the models-ready line calls it.)

/* The sensors start LAST and their failure is never fatal. Chrome will not prompt for
   a device without a gesture in some configurations, so a click also retries. The
   venue kiosk launch passes --use-fake-ui-for-media-stream so neither ever prompts. */
if (!NOCAM) {
  field.start().then(ok => { if (!ok) console.warn('motion sensor off:', field.error); });
}
if (!NOMIC) {
  audio.start().then(ok => { if (!ok) console.warn('sound off:', audio.error); });
}
addEventListener('pointerdown', () => {
  if (!NOCAM && !field.live) field.start();
  if (!NOMIC && !audio.live) audio.start();
}, { once: true });
</script>
</body>
</html>
